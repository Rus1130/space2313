<script>
    /*

            // energy required to raise 1 mole by 1 K (or 1°C)

        latentHeatFusion: molar latent heat of fusion (J/mol)
            // energy required to melt 1 mole after reaching the melting point

        boilingPoint: boiling point (°C)

        thermalConductivity: thermal conductivity (W/m·K)

        emissivity: emissivity (dimensionless, 0–1)

        refractiveIndex: refractive index (dimensionless)

        extinctionCoefficient: extinction coefficient (dimensionless)

            // yieldStrength: toPa(70, "MPa"),
            // compressiveStrength: toPa(210, "MPa"),

        },

    /*
        diameter: diameter (mm)
        mass: mass (g)
        velocity: velocity (m/s)

        length: length of the round (mm)

    */
    const roundPresets = {
        "20mm Autocannon WC": {
            diam: 20.00, 
            mass: 130, 
            vel: 1050,
            core: "Tungsten",
            shape: "ogive"
        },
        "30mm Autocannon WC": {
            diam: 30.00,
            mass: 360,
            vel: 900,
            core: "Tungsten",
            shape: "ogive"
        },
    };

    const shapeFactors = {
        blunt: 0.7,
        round: 0.9,
        ogive: 1.1,
        ap: 1.3,
        penetrator: 1.5
    };

    const roundMaterialSelect = document.getElementById("roundMaterial");
 
    for (const name of [
        "Lead",
        "Copper",
        "Steel AR500",
        "Tungsten",
    ]) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        roundMaterialSelect.appendChild(option);
    }
 
    roundMaterialSelect.value = "Lead";
        
 
    function toPa(value, unit) {
        unit = unit.toLowerCase().replace(/\s+/g, "");
 
        switch (unit) {
            case "pa":
                return value;
 
            case "kpa":
                return value * 1e3;
 
            case "mpa":
                return value * 1e6;
 
            case "gpa":
                return value * 1e9;
 
            case "bar":
                return value * 1e5;
 
            case "psi":
                return value * 6894.76;
 
            default:
                throw new Error(`Unknown pressure unit: ${unit}`);
        }
    }
 
    function JkgToJmol(value, molarMass) {
        // value: energy in J/kg
        // molarMass: g/mol
 
        return value * (molarMass / 1000);
    }
 
    function kJkgToJmol(value, molarMass) {
        // value: energy in kJ/kg
        // molarMass: g/mol
 
        return value * 1000 * (molarMass / 1000);
    }
 
    function KToC(value) {
        return value - 273.15;
    }
 
    const laserPresets = {
        "Light Laser": { power: 1, diameter: 5 },
    }
 
    const presets = {
        "Tungsten Plate": {
            initial_temp: -180,
            layers: [
                {material: "Tungsten", thickness: 20}
            ]
        },
        "Light Armor": {
            initial_temp: -180,
            layers: [
                {material: "Titanium Alloy", thickness: 20},
                {material: "Silicon Carbide", thickness: 20},
                {material: "Carbon Composite", thickness: 20}
            ]
        },
        "Medium Armor": {
            initial_temp: -180,
            layers: [
                {material: "Copper", thickness: 30},
                {material: "Silicon Carbide", thickness: 30},
                {material: "Carbon Composite", thickness: 30}
            ]
        },
    };
 
    function reflectivity(n, k) {
        const numerator = (n - 1) ** 2 + k ** 2;
        const denominator = (n + 1) ** 2 + k ** 2;
        return numerator / denominator;
    }
 
    const armorPresetSelect = document.getElementById("presetSelect");
    const roundPresetSelect = document.getElementById("roundPreset");
    const weaponTypeSelect = document.getElementById("weaponType");
 
    for (const name in roundPresets) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        roundPresetSelect.appendChild(option);
    }
 
    const laserPresetSelect = document.getElementById("laserPreset");
 
    for (const name in laserPresets) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        laserPresetSelect.appendChild(option);
    }
 
    function applyLaserPreset(name) {
        const p = laserPresets[name];
 
        if (!p) return;
 
        power.value = p.power;
        diam.value = p.diameter;
 
        calc();
    }
 
    function applyRoundPreset(name) {
        const p = roundPresets[name];
        if (!p) return;
 
        roundDiam.value = p.diam;
        roundMass.value = p.mass;
        roundVel.value = p.vel;
 
        if (p.core) {
            roundMaterial.value = p.core;
        }
 
        if (p.shape) {
            roundShape.value = p.shape;
        }
 
        calc();
    }
 
    function currentWeaponType() {
        return weaponType.value;
    }
 
    function exportPreset(){
 
        const armorPreset = {
            initial_temp: Number(temp.value),
            layers: getLayers()
        };
 
        const weaponPreset = {
            weaponType: currentWeaponType()
        };
 
        if (weaponPreset.weaponType === "laser") {
            weaponPreset.power = Number(power.value);
            weaponPreset.diameter = Number(diam.value);
        } else {
            weaponPreset.round = {
                diam: Number(roundDiam.value),
                mass: Number(roundMass.value),
                vel: Number(roundVel.value),
                material: roundMaterial.value,
                shape: roundShape.value
            };
        }
 
        console.log("Armor Preset:\n" + JSON.stringify(armorPreset, null, 4));
        console.log("Weapon Preset:\n" + JSON.stringify(weaponPreset, null, 4));
    }
 
    for(const name in presets){
 
        const option = document.createElement("option");
 
        option.value = name;
        option.textContent = name;
 
        armorPresetSelect.appendChild(option);
    }
 
    function setWeaponType(type) {
        weaponType.value = type;
        toggleModeInputs();
    }
 
    function toggleModeInputs() {
        const isLaser = weaponType.value === "laser";
        document.getElementById("laserInputs").style.display = isLaser ? "block" : "none";
        document.getElementById("kineticInputs").style.display = isLaser ? "none" : "block";
    }
 
    function loadArmorPreset(presetName){
 
        const preset = presets[presetName];
 
        if(!preset) return console.error("Preset not found:", presetName);
 
        // setWeaponType(preset.weaponType || "laser");
        temp.value = preset.initial_temp;
 
        // if (preset.weaponType === "kinetic" && preset.round) {
        //     roundDiam.value = preset.round.diam;
        //     roundMass.value = preset.round.mass;
        //     roundVel.value = preset.round.vel;
        //     roundMaterial.value = preset.round.material;
        //     roundPresetSelect.value = preset.round.preset || "";
        // } else {
        //     power.value = preset.power;
        //     diam.value = preset.diameter;
        // }
 
        renderLayers(
            structuredClone(preset.layers)
        );
 
        calc();
    }
 
 
    function addLayer() {
        const layers = getLayers();
 
        layers.push({
            material: Object.keys(materials)[0],
            thickness: 10
        });
 
        renderLayers(layers);
        calc();
    }
 
    function removeLayer(index) {
        const layers = getLayers();
 
        layers.splice(index, 1);
 
        renderLayers(layers);
        calc();
    }
 
    function getLayers() {
        return [...document.querySelectorAll(".layer")].map(layer => ({
            material: layer.querySelector(".material").value,
            thickness: Number(layer.querySelector(".thickness").value)
        }));
    }
 
    const container = document.getElementById("layers");
 
    function renderLayers(layers = []) {
        container.innerHTML = "";
 
        layers.forEach((layer, i) => {
            const div = document.createElement("div");
            div.className = "layer";
 
            div.innerHTML =
                `<b>Layer ${i + 1}</b><br>` +
                `Material:` +
                `<select class="material">` +
                Object.keys(materials).map(mat =>
                    `<option value="${mat}"${mat === layer.material ? " selected" : ""}>${mat}</option>`
                ).join("")+
                `</select><br>` +
                `Thickness (cm):` +
                `<input class="thickness" type="number" value="${layer.thickness}">` +
                `<button type="button" onclick="removeLayer(${i})">Remove</button>`;
 
            container.appendChild(div);
        });
 
        bindInputs();
        calc();
    }
 
    function bindInputs() {
        document.querySelectorAll("input, select").forEach(el => {
            el.addEventListener("input", calc);
            el.addEventListener("change", calc);
        });
    }
 
    function calcLaser() {
        const P = Number(power.value) * 1e6;          // W
        const beamRadius = Number(diam.value) / 200;  // m
        const beamArea = Math.PI * beamRadius * beamRadius;
 
        const T0 = Number(temp.value);
 
        let out = "";
        let totalTime = 0;
 
        for (const [i, layer] of getLayers().entries()) {
 
            const mat = materials[layer.material];
 
            const thickness = layer.thickness / 100; // cm -> m
 
            const volume = beamArea * thickness;
            const mass = volume * mat.density;             // kg
            const molarMassKg = mat.molarMass / 1000;       // kg/mol
            const moles = mass / molarMassKg;               // mol
 
            //----------------------------------------------------
            // Optical reflection
            //----------------------------------------------------
 
            const R = reflectivity(
                mat.refractiveIndex,
                mat.extinctionCoefficient
            );
 
            const absorbedPower = P * (1 - R);
 
            //----------------------------------------------------
            // Heat losses (vacuum)
            //----------------------------------------------------
 
            const avgTemp =
                (
                    T0 +
                    mat.boilingPoint
                ) / 2 + 273.15;
 
            const radiationLoss =
                mat.emissivity *
                5.670374419e-8 *
                beamArea *
                (
                    Math.pow(avgTemp, 4) -
                    Math.pow(3, 4)
                );
 
            const conductionLoss =
                mat.thermalConductivity *
                beamArea *
                (
                    mat.boilingPoint -
                    T0
                ) /
                Math.max(thickness, 0.001);
 
            const netPower =
                Math.max(
                    absorbedPower -
                    radiationLoss -
                    conductionLoss,
            absorbedPower * 0.05
        );
 
            //----------------------------------------------------
            // Energy required (per mole, then scaled by moles present)
            //----------------------------------------------------
 
            const energyPerMol =
                mat.specificHeat *
                (
                    mat.meltingPoint - T0
                )
                +
                mat.latentHeatFusion;
 
            const energyRequired =
                energyPerMol *
                moles;
 
            const penetrationTime =
                energyRequired /
                netPower;
 
            const penetrationRate =
                thickness /
                penetrationTime;
 
            totalTime += penetrationTime;
 
            //----------------------------------------------------
            // Output
            //----------------------------------------------------
 
            out +=
                `Layer ${i + 1}: ${layer.material}\n` +
                // `Reflectivity: ${(R * 100).toFixed(1)} %\n` +
                // `Absorbed Power: ${(absorbedPower / 1e6).toFixed(2)} MW\n` +
                // `Radiation Loss: ${(radiationLoss / 1000).toFixed(2)} kW\n` +
                // `Conduction Loss: ${(conductionLoss / 1000).toFixed(2)} kW\n` +
                // `Net Heating Power: ${(netPower / 1e6).toFixed(2)} MW\n` +
                // `Mass Heated: ${mass.toFixed(3)} kg\n` +
                // `Moles Heated: ${moles.toFixed(2)} mol\n` +
                `Energy Required: ${(energyRequired / 1e6).toFixed(2)} MJ\n` +
                `Penetration Time: ${penetrationTime.toFixed(2)} s\n` +
                `Penetration Rate: ${(penetrationRate * 1000).toFixed(2)} mm/s\n\n`;
        }
 
        out +=
            `Total Penetration Time: ${totalTime.toFixed(2)} s`;
 
        return out;
    }
        
    function perforationThicknessCalc(massG, velocity, diameterMM, tensileStrengthPa, shapeFactor, penetratorFactor) {
        return shapeFactor * penetratorFactor * Math.sqrt(
            (1e6 * massG * velocity ** 2) /
            (0.7 * tensileStrengthPa * Math.PI * diameterMM)
        );
    }

    function penetratorEffectiveness(roundMat, refMat) {
        const densityRatio = roundMat.density / refMat.density;
        const strengthRatio = roundMat.ultimateTensileStrength / refMat.ultimateTensileStrength;
        return Math.pow(densityRatio, 0.5) * Math.pow(strengthRatio, 0.2);
    }
 
 
    function calcKinetic() {
        const dMM = +roundDiam.value;
        const massKg = +roundMass.value / 1000;
        let vel = +roundVel.value;
 
        const roundMat = materials[roundMaterial.value];
        const shape = roundShape.value;
        const shapeFactor = shapeFactors[shape] ?? 1.0;
 
        const r = (dMM / 1000) / 2;
        const A = Math.PI * r * r; // m²
 
        let out = "";
        out += `Round: ${dMM} mm, ${(massKg * 1000).toFixed(1)} g, ${vel.toFixed(0)} m/s (${roundMaterial.value}, ${shape})\n`;
 
        let KE = 0.5 * massKg * vel * vel;
        out += `Impact Energy: ${(KE / 1000).toFixed(2)} kJ\n\n`;
 
        const layers = getLayers();
 
        let stopped = false;
        let stopLayerIndex = null;
        let stopDepthCm = null;
 
        // Real ballistic parameters
        const sectionalDensity = massKg / A;                 // kg/m²
 
        layers.forEach((layer, i) => {
 
            if (stopped) {
                out += `Layer ${i + 1}: ${layer.material} -- not reached (round already stopped)\n\n`;
                return;
            }
 
            const mat = materials[layer.material];

            const penetratorFactor = penetratorEffectiveness(roundMat, mat);
 
            const thicknessMM = layer.thickness * 10; // cm -> mm
 
            const perforation =
                perforationThicknessCalc(
                    massKg * 1000,
                    vel,
                    dMM,
                    mat.ultimateTensileStrength,
                    shapeFactor,
                    penetratorFactor
                );
 
            out +=
                `Layer ${i + 1}: ${layer.material} (${layer.thickness} cm)\n` +
                `Calculated Penetration: ${perforation.toFixed(2)} mm\n` +
                `Armor Thickness: ${thicknessMM.toFixed(2)} mm\n`;
 
            if (perforation >= thicknessMM) {
 
                out +=
                    `Result: Layer defeated\n\n`;
 
            }
            else {
 
                const penetrationCm =
                    perforation / 10;
 
                out +=
                    `Result: ROUND STOPPED, penetrated ~${penetrationCm.toFixed(2)} cm into this layer\n\n`;
 
                stopped = true;
                stopLayerIndex = i;
                stopDepthCm = penetrationCm;
            }
 
        });
 
        if (stopped) {
 
            out +=
                `Outcome: Round stopped in Layer ${stopLayerIndex + 1} ` +
                `(${layers[stopLayerIndex].material}) at a depth of ${stopDepthCm.toFixed(2)} cm.`;
 
        }
        else {
 
            out +=
                `Outcome: Round fully penetrated all layers.`;
 
        }
 
        out = out.replace(/\n+$/g, "");
 
        return out;
    }
        
    function calc(){
        const out = currentWeaponType() === "laser" ? calcLaser() : calcKinetic();
        document.getElementById("out").textContent = out;
    }
 
    weaponTypeSelect.addEventListener("change", () => {
        toggleModeInputs();
        calc();
    });
 
    armorPresetSelect.addEventListener("change", () => {
        loadArmorPreset(armorPresetSelect.value);
    });
 
    document.querySelectorAll("input, select").forEach(x => {
        x.addEventListener("input", calc);
        x.addEventListener("change", calc);
    });
 
    setWeaponType("kinetic");
    toggleModeInputs();
    loadArmorPreset("Tungsten Plate");
    applyLaserPreset("Light Laser");

</script>
