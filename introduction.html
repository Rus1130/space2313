<head>
    <link rel="stylesheet" href="./src/css.css">
    <script src="https://rus1130.github.io/projects/Global/typewriter.js"></script>
    <meta property="og:title"       content="Introduction"                                      />
    <meta property="og:description" content="Then, humanity turned elsewhere."                  />
    <meta property="og:url"         content="https://rus1130.github.io/space2213/introduction/" />
    <title>Introduction</title>
</head>
<body>
    <div id="out"></div>
    <div class="button" id="return" onclick="location.href = 'https://rus1130.github.io/space2213/'" style="display: none;">▌< Return</div>
</body>
<script>
    fetch('./src/introduction.tw')
    .then(response => response.text())
    .then(text => {
        let tw3 = new Typewriter3(text, document.getElementById("out"), {
            charDelay: 50,
            newlineDelay: 100,
            customDelays: {
                ",": 350,
                ".": 700
            },
            newpageText: "▌Next >",
            defaultTextColor: "#ffffff",
            defaultBackgroundColor: "#000000",
            wordWrap: 80,
            onFunctionTag: () => {
                document.getElementById('return').style.display = 'block';
            }
        });

        document.body.addEventListener('keydown', (event) => {
            if (event.code === 'Space') tw3.togglePause();
            if (event.code === 'ArrowRight') tw3.speedOverride(1);
            if (event.code === 'ArrowLeft') tw3.speedOverride(null);
        });

        tw3.start();
    });
</script>
