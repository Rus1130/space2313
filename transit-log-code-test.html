    const colorBank = {
        "OK": "#339900",
        "WARNING": "#FFCC00",
        "ERROR": "#CC3300"
    }

    function outputSection(sectionName) {

        let finalOutput = "";

        const longestName = nameBank.reduce((a, b) => a.length > b.length ? a : b);

        const section = diagnosticsReport.find(s => s.name === sectionName);

        if (!section) {
            throw new Error(`Diagnostics section "${sectionName}" not found.`);
        }

        finalOutput += namify(sectionName) + " " + "=".repeat(longestName.length + 2) + "[newline]\n";

        for (const current of section.contents) {
            const padding = ".".repeat(longestName.length - current.name.length + 2);

            let strToOutput =
                `[tab ${namify(sectionName).length + 1}]` +
                namify(current.name) +
                padding;

                const sleepTimer = `[sleep ${timings[nameBank.indexOf(current.name)] * (current?.statuses == undefined ? 1 : current.statuses.length)}]`; // whatever character you want

                const firstPeriod = strToOutput.indexOf(".");
                if (firstPeriod !== -1) {
                    strToOutput =
                        strToOutput.slice(0, firstPeriod + 1) +
                        sleepTimer +
                        strToOutput.slice(firstPeriod + 1);
                }

            if(current?.desynced === true){

                const status = current.status.toUpperCase();
                const color = colorBank[status];

                finalOutput += `[tab ${namify(sectionName).length + 1}]${namify(current.name)}((SPECIAL TIMING GOES HERE))[color ${color}]${status}[resetcolor]` + "[newline]\n";
            } else {
                if (current.status) {
                    const color = colorBank[current.status.toUpperCase()];
                    strToOutput += `[color ${color}]${current.status.toUpperCase()}[resetcolor]`;
                    finalOutput += strToOutput + "[newline]\n";
                    continue;
                }

                const groups = [];

                let start = 0;
                let end = 0;
                let currentStatus = current.statuses[0];
                let allSame = true;

                for (let j = 1; j < current.statuses.length; j++) {
                    const status = current.statuses[j];

                    if (status !== currentStatus) {
                        allSame = false;

                        groups.push({
                            start,
                            end,
                            status: currentStatus
                        });

                        start = end = j;
                        currentStatus = status;
                    } else {
                        end = j;
                    }
                }

                groups.push({
                    start,
                    end,
                    status: currentStatus
                });

                if (allSame) {

                    let color = colorBank[currentStatus.toUpperCase()];

                    strToOutput += `[color ${color}]${currentStatus.toUpperCase()} ${current.statuses.length}[resetcolor]`;
                    finalOutput += strToOutput + "[newline]\n";
                } else {
                    finalOutput += strToOutput + "[newline]\n";

                    for (const group of groups) {

                        let status = group.status.toUpperCase();

                        const color = colorBank[status];

                        let label =
                            group.start === group.end
                                ? `${group.start+1} ${status}`
                                : `${group.start+1}\\-${group.end+1} ${status}`;

                        let indentCount = longestName.length - label.length + status.length + 2;

                        if(label.includes("-")) {
                            indentCount += 1;
                        }

                        const indent = `[tab ${indentCount + namify(sectionName).length + 1}]`;

                        // insert after the first space in label
                        label = label.replace(" ", `[color ${color}] `);
                        label+="[resetcolor]";

                        finalOutput += indent + label + "[newline]\n";
                    }
                }
            }
        }

        // get total number of statuses
        const totalStatuses = section.contents.reduce((acc, current) => {
            if (current.status) {
                return acc + 1;
            } else {
                return acc + current.statuses.length;
            }
        }, 0);

        // get total that are not error
        const totalNotError = section.contents.reduce((acc, current) => {
            if (current.status) {
                return acc + (current.status.toUpperCase() !== "ERROR" ? 1 : 0);
            } else {
                return acc + current.statuses.filter(s => s.toUpperCase() !== "ERROR").length;
            }
        }, 0);

        // get total that are okay

        const totalOkay = section.contents.reduce((acc, current) => {
            if (current.status) {
                return acc + (current.status.toUpperCase() === "OK" ? 1 : 0);
            } else {
                return acc + current.statuses.filter(s => s.toUpperCase() === "OK").length;
            }
        }, 0);

        finalOutput += `[newline]\n${namify(sectionName)} ${(totalOkay/totalStatuses*100).toFixed(2).replace(".00", "")+"%"}\n[linebreak]`;

        return finalOutput;
    }
