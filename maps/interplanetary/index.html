    let DAYS_PER_SECOND = 10;
    let days = 0;
    let paused = true;
    let updateBodiesAndLanes = true;
    let speedUnit = "day";
    let speedValue = 10;




    // let PIXELS_PER_AU = 200
    // let MOON_SCALAR = 30
    // let planetSize = 2
    // let moonSize = 1
    // let stationSize = 0.1
    // let majorLaneDash = [30, 30];
    // let minorLaneDash = [15, 15];
    // let startingZoom = 1
    // let moonOrbitWidth = 0.5

    let PIXELS_PER_AU = 10_000
    let MOON_SCALAR = 1
    let planetSize = 1
    let moonSize = 0.2
    let stationSize = 0.1
    let majorLaneDash = [140, 140];
    let minorLaneDash = [100, 100];
    let startingZoom = 0.01
    let moonOrbitWidth = 0.5
    let LANE_FLIP_COOLDOWN_DAYS = 0;
    let shipIdCounter = 0;

    const TAU = Math.PI * 2;

    const maxZoom = 250;
    const minZoom = 0.0025;

    const camera = {
        x: 0,
        y: 0,
        zoom: startingZoom
    };

    const paths = {};
    const bodies = {};
    const lanes = {};
    const ships = {};

    const kmToAU = km => km / 149597870.7;
    const kmToPixels = km => kmToAU(km) * PIXELS_PER_AU;
    const AUToPixels = au => au * PIXELS_PER_AU;
    const AUToKM = au => au * 149597870.7;
    const pixelsToKm = px => (px / PIXELS_PER_AU) * 149597870.7;
    const lyToAu = ly => ly * 63241.077;
    const lyToKm = ly => AUToKM(lyToAu(ly))

    function ms2ToKmDay2(ms2) {
        return ms2 * 86400 * 86400 / 1000;
    }

    const G = 9.8

    const CRUISE_ACCEL_KM_PER_DAY2 = ms2ToKmDay2(G * 0.25);   // constant 1g cruise burn
    const BOOST_ACCEL_KM_PER_DAY2  = ms2ToKmDay2(G * 0.25);  // "ridiculous" boost accel — tune to taste

    const BOOST_TIME_DAYS = 2;
    const BRAKE_TIME_DAYS = 2;

    const orbitsKM = {
        mercury: AUToKM(0.387099),
        venus: AUToKM(0.723332),
        earth: AUToKM(1),
        mars: AUToKM(1.523710),
        jupiter: AUToKM(5.202887),
        saturn: AUToKM(9.536675),
        uranus: AUToKM(19.189164),
        neptune: AUToKM(30.069922),
        asteroidBeltInner: AUToKM(2.06),
        asteroidBeltOuter: AUToKM(3.27),
    }

    orbitsKM.layer1Stations = (orbitsKM.mercury + orbitsKM.venus) / 2;
    orbitsKM.layer2Stations = (orbitsKM.venus + orbitsKM.earth) / 2;
    orbitsKM.layer3Stations = (orbitsKM.earth + orbitsKM.mars) / 2;
    orbitsKM.layer4Stations = AUToKM(1.95);
    orbitsKM.outerStations = AUToKM(3.35);

    const planets = {
        mercury: {
            radius: orbitsKM.mercury,
            period: 87.9691,
            color: 0x808080
        },
        venus: {
            radius: kmToPixels(orbitsKM.venus),
            period: 224.701,
            color: 0xff9500
        },
        earth: {
            radius: kmToPixels(orbitsKM.earth),
            period: 365.256363004,
            color: 0x0000ff
        },
        mars: {
            radius: kmToPixels(orbitsKM.mars),
            period: 686.980,
            color: 0xeb4034
        },
        jupiter: {
            radius: kmToPixels(orbitsKM.jupiter),
            period: 4332.589,
            color: 0xffa500
        },
        saturn: {
            radius: kmToPixels(orbitsKM.saturn),
            period: 10759.22,
            color: 0xffd700
        },
        uranus: {
            radius: kmToPixels(orbitsKM.uranus),

        },

        }
    };

    const laneColors = {
        earthMars: "#007d06",
        mercuryVenus: "#bd3d31",

        mercury1: "gray",

        venus1: "#ff9500",
        venus2: "#ff9500",

        earth1: "blue",
        earth2: "blue",

        mars1: "#eb4034",
        mars2: "#eb4034",

        station1To2: "#167dfa",
        station2To3: "#167dfa",
        station3To4: "#167dfa",

        station2To3Offset: "#36ad3c",
        station3To4Offset: "#36ad3c",
    }

    const stations = {
        layer1: {
            radius: kmToPixels(orbitsKM.layer1Stations),
            period: (planets.mercury.period + planets.venus.period) / 2,
            count: 6
        },
        layer2: {
            radius: kmToPixels(orbitsKM.layer2Stations),
            period: (planets.venus.period + planets.earth.period) / 2,
            count: 6
        },
        layer3: {
            radius: kmToPixels(orbitsKM.layer3Stations),

            count: 6
        },
        layer4: {
            radius: kmToPixels(orbitsKM.layer4Stations),
            period: 1.25 * planets.mars.period,
            count: 6
        },
        outer: {
            radius: kmToPixels(orbitsKM.outerStations),
            period: (planets.mars.period + planets.jupiter.period) / 2,

        }
    };

    function togglePause(){
        paused = !paused;
        refreshControls()
        console.log(`Simulation ${paused ? "paused" : "resumed"}`);
    }

    function recomputeDaysPerSecond() {
        DAYS_PER_SECOND = speedUnit === "hour" ? speedValue / 24 : speedValue;
    }

    recomputeDaysPerSecond();

    function refreshControls(){
        pauseButton.textContent = paused ? "▶" : "⏸";

        speedText.textContent = speedUnit === "hour"
            ? `${speedValue} h/s`
            : `${speedValue} d/s`;
    }

    function increaseSpeed(faster = false){
        if (speedUnit === "hour") {
            speedValue += 1;
            if (speedValue >= 24) {   // was: > 24
                speedUnit = "day";
                speedValue = 1;
            }
        } else {
            speedValue += faster ? 10 : 1;
        }

        recomputeDaysPerSecond();
        refreshControls();
        console.log(`Days per second: ${DAYS_PER_SECOND}`);
    }

    function decreaseSpeed(faster){
        if (speedUnit === "day") {
            speedValue -= faster ? 10 : 1;
            if (speedValue < 1) {
                // dropped below a full day
                speedUnit = "hour";
                speedValue = 23;
            }
        } else {
            speedValue -= 1;
            if (speedValue < 1) speedValue = 1; // floor at 1 hour/s
        }

        recomputeDaysPerSecond();
        refreshControls();
        console.log(`Days per second: ${DAYS_PER_SECOND}`);
    }



    const pauseButton = document.getElementById("pause");
    const speedText = document.getElementById("speed");

    pauseButton.onclick = () => {
        togglePause();
    };

    document.getElementById("faster").onclick = () => {
        increaseSpeed();
    };

    document.getElementById("slower").onclick = () => {
        decreaseSpeed();
    };

    refreshControls();

    function closestBody(body, orbitGroup, numberOffset = 0) {

        const stations = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup
        );

        if (stations.length === 0) return null;

        let closestIndex = 0;
        let closestDistance2 = Infinity;

        const tx = body.sprite.x;
        const ty = body.sprite.y;

        for (let i = 0; i < stations.length; i++) {

            const candidate = stations[i];

            const dx = candidate.sprite.x - tx;
            const dy = candidate.sprite.y - ty;

            const d2 = dx * dx + dy * dy;

            if (d2 < closestDistance2) {
                closestDistance2 = d2;
                closestIndex = i;
            }
        }

        // Wrap index around array length
        const targetIndex = (closestIndex + numberOffset) % stations.length;

        // Handle negative offsets
        return stations[(targetIndex + stations.length) % stations.length];
    }

    function closestBody2Orbits(orbitGroup1, orbitGroup2, numberOffset = 0){
        const bodies1 = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup1
        );

        const bodies2 = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup2
        );

        if (bodies1.length === 0 || bodies2.length === 0) return null;

        let closestBody1 = null;
        let closestBody2 = null;
        let closestDistance2 = Infinity;

        for (const body1 of bodies1) {
            for (const body2 of bodies2) {

                const dx = body2.sprite.x - body1.sprite.x;
                const dy = body2.sprite.y - body1.sprite.y;

                const d2 = dx * dx + dy * dy;

                if (d2 < closestDistance2) {
                    closestDistance2 = d2;
                    closestBody1 = body1;
                    closestBody2 = body2;
                }
            }
        }

        // Wrap index around array length
        const targetIndex = (bodies2.indexOf(closestBody2) + numberOffset) % bodies2.length;

        // Handle negative offsets
        return bodies2[(targetIndex + bodies2.length) % bodies2.length];
    }

    function laneArcPoint(A, B, t) {
        const r1 = Math.hypot(A.x, A.y);
        const r2 = Math.hypot(B.x, B.y);

        const a1 = Math.atan2(A.y, A.x);
        const a2 = Math.atan2(B.y, B.x);

        let delta = a2 - a1;
        while (delta > Math.PI) delta -= TAU;
        while (delta < -Math.PI) delta += TAU;

        const dr = r2 - r1;

        const r = r1 + dr * t;
        const a = a1 + delta * t;

        return {
            x: r * Math.cos(a),
            y: r * Math.sin(a)
        };
    }

    function buildArcLengthTable(pts) {
        const table = [{ t: 0, dist: 0, x: pts[0].x, y: pts[0].y }];
        let total = 0;

        for (let i = 1; i < pts.length; i++) {
            const a = pts[i - 1];
            const b = pts[i];

            total += Math.hypot(b.x - a.x, b.y - a.y);
            table.push({ t: i / (pts.length - 1), dist: total, x: b.x, y: b.y });
        }

        return { table, total };
    }

    function positionAtDistance(table, totalDist, targetDist) {
        if (targetDist <= 0) return { x: table[0].x, y: table[0].y };
        if (targetDist >= totalDist) return { x: table.at(-1).x, y: table.at(-1).y };

        for (let i = 1; i < table.length; i++) {
            if (table[i].dist >= targetDist) {
                const a = table[i - 1], b = table[i];
                const segLen = b.dist - a.dist;
                const frac = segLen === 0 ? 0 : (targetDist - a.dist) / segLen;

                return {
                    x: a.x + (b.x - a.x) * frac,
                    y: a.y + (b.y - a.y) * frac
                };
            }
        }
    }

    function bodyPositionAtDay(body, day) {
        const angle = TAU * (day / body.period + body.offset);

        let centerX = 0;
        let centerY = 0;

        if (body.orbit.centerBody) {
            const c = bodyPositionAtDay(body.orbit.centerBody, day);
            centerX = c.x;
            centerY = c.y;
        }

        return {
            x: centerX + body.orbit.radius * Math.cos(angle),
            y: centerY + body.orbit.radius * Math.sin(angle)
        };
    }

    function closestBodyAtDay(body, orbitGroup, day, numberOffset = 0) {
        const candidates = Object.values(bodies).filter(c => c.orbit.name === orbitGroup);
        if (candidates.length === 0) return null;

        const pos = bodyPositionAtDay(body, day);

        let closestIndex = 0;
        let closestDist2 = Infinity;

        for (let i = 0; i < candidates.length; i++) {
            const cp = bodyPositionAtDay(candidates[i], day);
            const dx = cp.x - pos.x, dy = cp.y - pos.y;
            const d2 = dx * dx + dy * dy;

            if (d2 < closestDist2) { closestDist2 = d2; closestIndex = i; }
        }

        const targetIndex = (closestIndex + numberOffset) % candidates.length;
        return candidates[(targetIndex + candidates.length) % candidates.length];
    }

    function closestBody2OrbitsAtDay(orbitGroup1, orbitGroup2, day, numberOffset = 0) {
        const bodies1 = Object.values(bodies).filter(c => c.orbit.name === orbitGroup1);
        const bodies2 = Object.values(bodies).filter(c => c.orbit.name === orbitGroup2);
        if (bodies1.length === 0 || bodies2.length === 0) return null;

        let closestBody1 = null, closestBody2 = null, closestDist2 = Infinity;

        for (const b1 of bodies1) {
            const p1 = bodyPositionAtDay(b1, day);
            for (const b2 of bodies2) {
                const p2 = bodyPositionAtDay(b2, day);
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const d2 = dx * dx + dy * dy;

                if (d2 < closestDist2) { closestDist2 = d2; closestBody1 = b1; closestBody2 = b2; }
            }
        }

        const targetIndex = (bodies2.indexOf(closestBody2) + numberOffset) % bodies2.length;
        return bodies2[(targetIndex + bodies2.length) % bodies2.length];
    }

    function estimateTravelTimeDays(distanceKm, accel, decel) {
        if (distanceKm <= 0) return 0;

        const peakVel = Math.sqrt((2 * distanceKm * accel * decel) / (accel + decel));

        return peakVel * (1 / accel + 1 / decel);
    }

    function createShip(lane) {
        if (!lane.endingBody) return;
        if (!lane.pts || lane.pts.length < 2) return;

        const totalDistKm = pixelsToKm(buildArcLengthTable(lane.pts).total);
        if (totalDistKm <= 0) return;

        const accel = lane.accelKmPerDay2 ?? BOOST_ACCEL_KM_PER_DAY2;
        const decel = lane.decelKmPerDay2 ?? BOOST_ACCEL_KM_PER_DAY2;

        const estimatedTravelDays = estimateTravelTimeDays(totalDistKm, accel, decel);

        if (lane.predictEndpoints && !lane.skipRetargetGuard) {
            const future = lane.predictEndpoints(days + estimatedTravelDays);

            const futureEndingName = future.endingBody?.name ?? lane.endingBody.name;
            const futureStartingName = future.startingBody?.name ?? lane.startingBody.name;

            if (futureEndingName !== lane.endingBody.name || futureStartingName !== lane.startingBody.name) {
                console.log(`Lane "${lane.name}" will retarget before a ship could arrive — launch blocked.`);
                // lane.disabledUntil = days + estimatedTravelDays;
                return;
            }
        }

        // flight profile that updateShips/flightPositionAtElapsed rely on.
        const profile = computeFlightProfile(totalDistKm);

        const id = `ship${shipIdCounter++}`;

        const startPt = lane.pts[0];
        const sprite = new PIXI.Graphics().circle(0, 0, 2).fill(0xff0000);
        sprite.position.set(startPt.x, startPt.y);

        sprite.eventMode = "static";
        sprite.cursor = "pointer";
        sprite.on("pointerup", () => {
            shipClicked = id;
            bodyClicked = null;
            console.log(`Ship "${id}" focused`);
        });

        shipLayer.addChild(sprite);

        const label = new PIXI.Text({
            text: "0%\n0 km/h",
            style: { fontFamily: "Monospace", fontSize: 9, fill: 0xff0000 },
            resolution: 10
        });
        label.anchor.set(0.5, 1.5);
        labelLayer.addChild(label);

        ships[id] = {
            id,
            lane,
            profile,             // NEW: stash the profile on the ship
            elapsedDays: 0,
            sprite,
            label,
            arrived: false
        };

        console.log(`Ship "${id}" launched on lane "${lane.name}"`);
    }

    function updateShips(deltaDays) {
        for (const ship of Object.values(ships)) {
            if (ship.arrived) continue;

            const lane = ship.lane;
            if (!lane.pts || lane.pts.length < 2) continue;

            ship.elapsedDays += deltaDays;

            const { table, total: totalPx } = buildArcLengthTable(lane.pts);
            const { traveledKm, velocityKmPerDay, arrived } = flightPositionAtElapsed(ship.profile, ship.elapsedDays);

            if (arrived) {
                const finalPos = table.at(-1);
                ship.sprite.position.set(finalPos.x, finalPos.y);
                ship.label.position.set(finalPos.x, finalPos.y);

                ship.arrived = true;
                const hours = ship.elapsedDays * 24;
                ship.label.text = `arrived: ${hours.toFixed(2)}h\n0 km/h`;
                console.log(`Ship "${ship.id}" arrived. Total travel time: ${hours.toFixed(2)} hours (${ship.elapsedDays.toFixed(4)} days), distance: ${ship.profile.total.toLocaleString(undefined, { maximumFractionDigits: 0 })} km`);
                continue;
            }

            const pos = positionAtDistance(table, totalPx, kmToPixels(traveledKm));
            ship.sprite.position.set(pos.x, pos.y);
            ship.label.position.set(pos.x, pos.y);

            const remainingKm = Math.max(0, ship.profile.total - traveledKm);
            const etaDays = velocityKmPerDay > 0 ? remainingKm / velocityKmPerDay : Infinity;

            const speedKmh = velocityKmPerDay / 24;
            const etaText = Number.isFinite(etaDays) ? `ETA ${(etaDays * 24).toFixed(1)}h` : `ETA --`;
            ship.label.text = `${etaText}\n${speedKmh.toLocaleString(undefined, { maximumFractionDigits: 0 })} km/h`;
        }
    }
        
    function createOrbit(name, radiusKm, options = {}) {

        const radius = kmToPixels(radiusKm);

        const orbit = new PIXI.Graphics();

        orbit
            .circle(0, 0, radius)
            .stroke({
                color: options.color ?? 0x000000,
                width: options.width ?? 0.5,
                alpha: options.opacity ?? 1
            });

        orbitLayer.addChild(orbit);

        let centerBody = null;

        if (options.centerBody) {
            centerBody = typeof options.centerBody === "string"
                ? bodies[options.centerBody]
                : options.centerBody;
        }

        paths[name] = {
            name,
            radius,
            centerBody,
            shape: orbit,

            color: options.color ?? 0x000000,
            opacity: options.opacity ?? 1,
            baseWidth: options.width ?? 0.5
        };

        return paths[name];
    }

    function redrawOrbit(orbit) {
        orbit.shape.clear();

        orbit.shape
            .circle(0, 0, orbit.radius)
            .stroke({
                color: orbit.color,
                width: Math.max(orbit.baseWidth / camera.zoom, 0.01),
                alpha: orbit.opacity
            });

    }

    function removeOrbit(name) {
        const orbit = paths[name];

        if (!orbit) {
            throw new Error(`Orbit "${name}" does not exist.`);
        }

        orbitLayer.removeChild(orbit.shape);
        delete paths[name];
    }

    function removeBody(name) {
        const body = bodies[name];

        if (!body) {
            throw new Error(`Body "${name}" does not exist.`);
        }

        bodyLayer.removeChild(body.sprite);
        labelLayer.removeChild(body.label);

        delete bodies[name];
    }

    let bodyClicked = null;
    let shipClicked = null;

    function computeFlightProfile(totalDistKm) {
        const a1 = BOOST_ACCEL_KM_PER_DAY2;
        const g  = CRUISE_ACCEL_KM_PER_DAY2;
        const t1 = BOOST_TIME_DAYS;
        const t3 = BRAKE_TIME_DAYS;

        const v1 = a1 * t1;             // velocity at end of boost
        const s1 = 0.5 * a1 * t1 * t1;  // distance covered during boost

        // Solve for cruise duration t2 so boost + cruise(1g) + brake(fixed t3,
        // decel chosen so v hits exactly 0 at arrival) covers totalDistKm:
        //   0.5*g*t2² + (v1 + 0.5*g*t3)*t2 + (s1 + 0.5*v1*t3 - totalDistKm) = 0
        const A = 0.5 * g;
        const B = v1 + 0.5 * g * t3;
        const C = s1 + 0.5 * v1 * t3 - totalDistKm;

        const discriminant = B * B - 4 * A * C;
        const t2 = discriminant >= 0 ? (-B + Math.sqrt(discriminant)) / (2 * A) : -1;

        if (t2 >= 0) {
            const v2End = v1 + g * t2;
            const s2 = v1 * t2 + 0.5 * g * t2 * t2;
            const d3 = v2End / t3;        // decel needed to stop in exactly t3
            const s3 = 0.5 * v2End * t3;

            return {
                kind: "boost-cruise-brake",
                t1, t2, t3, a1, g, d3, v1, v2End, s1, s2, s3,
                total: s1 + s2 + s3
            };
        }

        // Route too short to fit a full 24h boost + 24h brake with any cruise
        // in between — fall back to a symmetric triangular burn (no plateau),
        // using the boost rate as both accel and decel.
        const peakVel = Math.sqrt(totalDistKm * a1);
        const tPeak = peakVel / a1;

        return { kind: "triangular", tPeak, a1, peakVel, total: totalDistKm };
    }

    function flightPositionAtElapsed(profile, elapsedDays) {
        if (profile.kind === "triangular") {
            const { tPeak, a1, peakVel, total } = profile;
            const totalTime = tPeak * 2;

            if (elapsedDays >= totalTime) return { traveledKm: total, velocityKmPerDay: 0, arrived: true };

            if (elapsedDays <= tPeak) {
                const t = elapsedDays;
                return { traveledKm: 0.5 * a1 * t * t, velocityKmPerDay: a1 * t, arrived: false };
            } else {
                const t = elapsedDays - tPeak;
                return {
                    traveledKm: 0.5 * a1 * tPeak * tPeak + peakVel * t - 0.5 * a1 * t * t,
                    velocityKmPerDay: Math.max(peakVel - a1 * t, 0),
                    arrived: false
                };
            }
        }

        const { t1, t2, t3, a1, g, d3, v1, v2End, s1, s2, total } = profile;

        if (elapsedDays <= t1) {
            const t = elapsedDays;
            return { traveledKm: 0.5 * a1 * t * t, velocityKmPerDay: a1 * t, arrived: false };
        }

        if (elapsedDays <= t1 + t2) {
            const t = elapsedDays - t1;
            return {
                traveledKm: s1 + v1 * t + 0.5 * g * t * t,
                velocityKmPerDay: v1 + g * t,
                arrived: false
            };
        }

        if (elapsedDays <= t1 + t2 + t3) {
            const t = elapsedDays - (t1 + t2);
            return {
                traveledKm: s1 + s2 + (v2End * t - 0.5 * d3 * t * t),
                velocityKmPerDay: Math.max(v2End - d3 * t, 0),
                arrived: false
            };
        }

        return { traveledKm: total, velocityKmPerDay: 0, arrived: true };
    }

    function createBody(name, orbitName, periodDays, options = {}) {

        const orbit = paths[orbitName];

        if (!orbit) {
            throw new Error(`Orbit "${orbitName}" does not exist.`);
        }

        const body = new PIXI.Graphics();

        body
            .circle(0, 0, options.radius ?? 3)
            .fill(options.color ?? 0xffffff);

        body.interactive = true;
        body.on("pointerup", () => {
            bodyClicked = name;
            console.log(`Body "${name}" focused`);
        });

        bodyLayer.addChild(body);

        const label = new PIXI.Text({
            text: options.label ?? name,
            style: {
                fontFamily: options.fontFamily ?? "Monospace",
                fontSize: options.fontSize ?? 10,
                fill: options.labelColor ?? 0x000000,
            },
            resolution: 10
        });

        label.anchor.set(0.1, 0.5);

        labelLayer.addChild(label);

        bodies[name] = {
            name,
            orbit,
            period: periodDays,
            offset: options.offset ?? 0,
            radius: options.radius ?? 4,
            sprite: body,
            label,
            labelDistance: options.labelDistance ?? 0
        };

        return bodies[name];
    }

    function createLane(name, startingBody, options = {}) {
        const graphics = new PIXI.Graphics();

        graphics.eventMode = "static";   // ADD
        graphics.cursor = "pointer";      // ADD

        laneLayer.addChild(graphics);

        graphics.on("pointerup", () => {   // ADD
            const lane = lanes[name];
            if (lane) createShip(lane);
        });

        const [dashlength, gapLength] = options.dash ?? [0, 0];

        const ts = new Float32Array(options.segments ?? 32);

        for (let i = 0; i < ts.length; i++) {
            ts[i] = i / (ts.length - 1);
        }

        const resolvedStart = typeof startingBody === "string"
            ? bodies[startingBody]
            : startingBody;

        lanes[name] = {
            name,
            graphics,
            startingBody: resolvedStart,
            endingBody: null,
            color: options.color ?? 0x44ffff,
            width: options.width ?? 1,
            dashLength: dashlength,
            gapLength: gapLength,
            ts,

            accelKmPerDay2: options.accelKmh2
                ? options.accelKmh2 * 576
                : BOOST_ACCEL_KM_PER_DAY2,
            decelKmPerDay2: options.decelKmh2
                ? options.decelKmh2 * 576
                : BOOST_ACCEL_KM_PER_DAY2,

            // NEW: skip the retarget-prediction launch guard for lanes whose
            // endpoints are chosen among near-equidistant candidates, where a
            // "wrong" guess barely changes real travel distance/time.
            skipRetargetGuard: options.skipRetargetGuard ?? false,

            lastStartingName: resolvedStart?.name ?? null,
            lastEndingName: null,
            disabledUntil: -Infinity,
        };

        return lanes[name];
    }

    function updateLane(name, endingBody, options = {}) {

        const lane = lanes[name];

        if(!lane) throw new Error(`Lane "${name}" does not exist.`);
        if(!endingBody) throw new Error(`Ending body for lane "${name}" does not exist.`);

        options.startingBody = options.startingBody ?? lane.startingBody;
        options.laneCooldown = options.laneCooldown ?? LANE_FLIP_COOLDOWN_DAYS;

        lane.startingBody = options.startingBody;
        lane.endingBody = endingBody;
        lane.predictEndpoints = options.predict ?? null;

        const endingChanged = lane.lastEndingName !== null
            && lane.lastEndingName !== endingBody.name;

        const startingChanged = lane.lastStartingName !== null
            && lane.lastStartingName !== lane.startingBody.name;

        if (endingChanged || startingChanged) {
            lane.disabledUntil = days + options.laneCooldown;
        }

        lane.lastEndingName = endingBody.name;
        lane.lastStartingName = lane.startingBody.name;

        const g = lane.graphics;
        g.clear();

        if (days < lane.disabledUntil) {
            return {
                startingBody: lane.startingBody,
                endingBody,
                delta: null,
                travelled: 0,
                disabled: true
            };
        }

        // curve 
        const p1 = lane.startingBody.sprite.position;
        const p2 = endingBody.sprite.position;

        const r1 = Math.hypot(p1.x, p1.y);
        const r2 = Math.hypot(p2.x, p2.y);

        const a1 = Math.atan2(p1.y, p1.x);
        const a2 = Math.atan2(p2.y, p2.x);

        let delta = a2 - a1;

        while (delta > Math.PI) delta -= TAU;
        while (delta < -Math.PI) delta += TAU;

        const dr = r2 - r1;

        const pts = [];

        for (const t of lane.ts) {

            const r = r1 + dr * t;
            const a = a1 + delta * t;

            pts.push({
                x: r * Math.cos(a),
                y: r * Math.sin(a)
            });
        }
        // ==

        // straight line
        // const start = lane.startingBody.sprite.position;
        // const end = endingBody.sprite.position;

        // const pts = [];

        // for (const t of lane.ts) {
        //     pts.push({
        //         x: start.x + (end.x - start.x) * t,
        //         y: start.y + (end.y - start.y) * t
        //     });
        // }
        // == 

        const dash = lane.dashLength;
        const gap = lane.gapLength;
        const pattern = dash + gap;
        lane.pts = pts;

        let travelled = 0;

        for (let i = 0; i < pts.length - 1; i++) {

            const p0 = pts[i];
            const p1 = pts[i + 1];

            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;

            const length = Math.hypot(dx, dy);

            if (length === 0) continue;

            const ux = dx / length;
            const uy = dy / length;

            let local = 0;

            while (local < length) {

                const phase = travelled % pattern;

                if (phase < dash) {

                    const drawLength = Math.min(
                        dash - phase,
                        length - local
                    );

                    g.moveTo(
                        p0.x + ux * local,
                        p0.y + uy * local
                    );

                    g.lineTo(
                        p0.x + ux * (local + drawLength),
                        p0.y + uy * (local + drawLength)
                    );

                    local += drawLength;
                    travelled += drawLength;

                } else {

                    const skipLength = Math.min(
                        pattern - phase,
                        length - local
                    );

                    local += skipLength;
                    travelled += skipLength;

                }
            }
        }

        g.stroke({
            color: lane.color,
            width: lane.width / camera.zoom
        });

        g.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
            g.lineTo(pts[i].x, pts[i].y);
        }
        g.stroke({
            color: lane.color,
            width: Math.max(10 / camera.zoom, 6),
            alpha: 0.001   // near-zero alpha; some PIXI versions skip hit-testing on true 0 alpha
        });
    }

    app.canvas.addEventListener("wheel", e => {
        e.preventDefault();

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        // World coordinates before zoom
        const worldX =
            camera.x +
            (mouseX - app.renderer.width / 2) / camera.zoom;

        const worldY =
            camera.y +
            (mouseY - app.renderer.height / 2) / camera.zoom;

        const factor = Math.exp(-e.deltaY * 0.001);

        camera.zoom *= factor;

        camera.zoom = Math.max(minZoom, Math.min(maxZoom, camera.zoom));

        // Keep mouse pointing at same world location
        camera.x =
            worldX -
            (mouseX - app.renderer.width / 2) / camera.zoom;

        camera.y =
            worldY -
            (mouseY - app.renderer.height / 2) / camera.zoom;

        updateCamera();

    }, { passive: false });

    const touches = new Map();

    function distance(a,b){
        return Math.hypot(
            a.clientX-b.clientX,
            a.clientY-b.clientY
        );
    }

    let previousDistance = 0;

    app.canvas.addEventListener("pointerdown", e => {
        if(e.pointerType==="touch") touches.set(e.pointerId, e);
    });

    app.canvas.addEventListener("pointermove", e => {
        if(e.pointerType!=="touch") return;

        touches.set(e.pointerId, e);

        if(touches.size!==2) return;

        const [a, b] = [...touches.values()];

        const d = distance(a, b);

        if(previousDistance){

            const factor = d / previousDistance;

            camera.zoom *= factor;

            camera.zoom = Math.max(minZoom, Math.min(maxZoom, camera.zoom));

            updateCamera();
        }

        previousDistance = d;
    });

    function updateBodies() {
        for (const body of Object.values(bodies)) {

            const angle = TAU * (
                days / body.period +
                body.offset
            );

            let centerX = 0;
            let centerY = 0;

            if (body.orbit.centerBody) {
                centerX = body.orbit.centerBody.sprite.x;
                centerY = body.orbit.centerBody.sprite.y;
            }

            body.sprite.position.set(
                centerX + body.orbit.radius * Math.cos(angle),
                centerY + body.orbit.radius * Math.sin(angle)
            );
        }

        // Move satellite orbit graphics
        for (const orbit of Object.values(paths)) {

            if (!orbit.centerBody) continue;

            orbit.shape.position.copyFrom(
                orbit.centerBody.sprite.position
            );
        }
    }

    function updateCamera() {

        let pivotX = camera.x;
        let pivotY = camera.y;

        if (bodyClicked) {
            const body = bodies[bodyClicked];

            if (body) {
                pivotX = body.sprite.x;
                pivotY = body.sprite.y;
            }
        }

        if (shipClicked) {   // ADD
            const ship = ships[shipClicked];

            if (ship) {
                pivotX = ship.sprite.x;
                pivotY = ship.sprite.y;
            } else {
                shipClicked = null; // ship arrived/removed — stop trying to follow it
            }
        }

        world.pivot.set(pivotX, pivotY);

        world.position.set(
            app.renderer.width / 2,
            app.renderer.height / 2
        );

        world.scale.set(camera.zoom);

        for (const body of Object.values(bodies)) {
            body.sprite.scale.set(Math.max(1 / camera.zoom, 1.1));

            const labelScale = 1 / camera.zoom;

            // const labelScale = Math.min(
            //     Math.max(1 / camera.zoom, 0.5),
            //     3
            // );

            if(body.labelDistance > camera.zoom) body.label.alpha = 0;
            else body.label.alpha = 1;

            body.label.scale.set(labelScale);

            body.label.position.set(
                body.sprite.x + (body.radius + 4) / camera.zoom,
                body.sprite.y
            );
        }

        for (const ship of Object.values(ships)) {
            ship.sprite.scale.set(Math.max(1 / camera.zoom, 0.5));
            ship.label.scale.set(Math.max(1 / camera.zoom, 0.5));
        }

        for (const orbit of Object.values(paths)) {
            redrawOrbit(orbit);
        }
    }
