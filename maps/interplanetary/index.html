<script type="module">
    const app = new PIXI.Application();

    await app.init({
        resizeTo: window,
        background: "#ffffff",
        antialias: true,
        autoDensity: true,
        resolution: window.devicePixelRatio,
    });

    document.body.appendChild(app.canvas);

    const world = new PIXI.Container();

    const sun = new PIXI.Graphics()
        .circle(0, 0, 10)
        .fill(0xffaa00);

    world.addChild(sun);

    const orbitLayer = new PIXI.Container();
    const bodyLayer = new PIXI.Container();
    const labelLayer = new PIXI.Container();
    const laneLayer = new PIXI.Container();

    world.addChild(orbitLayer);
    world.addChild(laneLayer);
    world.addChild(bodyLayer);
    world.addChild(labelLayer);

    app.stage.addChild(world);

    let DAYS_PER_SECOND = 10;
    let days = 0;
    let paused = true;
    let updateBodiesAndLanes = true;

    const pauseButton = document.getElementById("pause");
    const speedText = document.getElementById("speed");

    function refreshControls(){

        pauseButton.textContent = paused ? "▶" : "⏸";
        speedText.textContent = `${DAYS_PER_SECOND} d/s`;
    }

    pauseButton.onclick = () => {
        togglePause();
    };

    document.getElementById("faster").onclick = () => {
        increaseSpeed();
    };

    document.getElementById("slower").onclick = () => {
        decreaseSpeed();
    };

    refreshControls();


    // let PIXELS_PER_AU = 200
    // let MOON_SCALAR = 30
    // let planetSize = 2
    // let moonSize = 1
    // let stationSize = 0.1
    // let majorLaneDash = [30, 30];
    // let minorLaneDash = [15, 15];
    // let startingZoom = 1
    // let moonOrbitWidth = 0.5

    let PIXELS_PER_AU = 10_000
    let MOON_SCALAR = 1
    let planetSize = 1
    let moonSize = 0.2
    let stationSize = 0.1
    let majorLaneDash = [140, 140];
    let minorLaneDash = [100, 100];
    let startingZoom = 0.01
    let moonOrbitWidth = 0.5

    const TAU = Math.PI * 2;

    const camera = {
        x: 0,
        y: 0,
        zoom: startingZoom
    };

    const paths = {};
    const bodies = {};
    const lanes = {};

    const kmToAU = km => km / 149597870.7;
    const kmToPixels = km => kmToAU(km) * PIXELS_PER_AU;
    const AUToPixels = au => au * PIXELS_PER_AU;
    const AUToKM = au => au * 149597870.7;

    const orbitsKM = {
        mercury: AUToKM(0.387099),
        venus: AUToKM(0.723332),
        earth: AUToKM(1),
        mars: AUToKM(1.523710),
        jupiter: AUToKM(5.202887),
        saturn: AUToKM(9.536675),
        uranus: AUToKM(19.189164),
        neptune: AUToKM(30.069922),
        asteroidBeltInner: AUToKM(2.06),
        asteroidBeltOuter: AUToKM(3.27),
    }

    orbitsKM.layer1Stations = (orbitsKM.mercury + orbitsKM.venus) / 2;
    orbitsKM.layer2Stations = (orbitsKM.venus + orbitsKM.earth) / 2;
    orbitsKM.layer3Stations = (orbitsKM.earth + orbitsKM.mars) / 2;
    orbitsKM.layer4Stations = AUToKM(1.95);
    orbitsKM.outerStations = AUToKM(3.35);

    const planets = {
        mercury: {
            radius: orbitsKM.mercury,
            period: 87.9691,
            color: 0x808080
        },
        venus: {
            radius: kmToPixels(orbitsKM.venus),
            period: 224.701,
            color: 0xff9500
        },
        earth: {
            radius: kmToPixels(orbitsKM.earth),
            period: 365.256363004,
            color: 0x0000ff
        },
        mars: {
            radius: kmToPixels(orbitsKM.mars),
            period: 686.980,
            color: 0xeb4034
        },
        jupiter: {
            radius: kmToPixels(orbitsKM.jupiter),
            period: 4332.589,
            color: 0xffa500
        },
        saturn: {
            radius: kmToPixels(orbitsKM.saturn),
            period: 10759.22,
            color: 0xffd700
        },
        uranus: {
            radius: kmToPixels(orbitsKM.uranus),
            period: 30688.5,
            color: 0x29b8ff
        },
        neptune: {
            radius: kmToPixels(orbitsKM.neptune),
            period: 60182,
            color: 0x0000ff
        }
    };

    const laneColors = {
        earthMars: "#007d06",
        mercuryVenus: "#bd3d31",

        mercury1: "gray",

        venus1: "#ff9500",
        venus2: "#ff9500",

        earth1: "blue",
        earth2: "blue",

        mars1: "#eb4034",
        mars2: "#eb4034",

        station1To2: "#167dfa",
        station2To3: "#167dfa",
        station3To4: "#167dfa",

        station2To3Offset: "#36ad3c",
        station3To4Offset: "#36ad3c",
    }

    const stations = {
        layer1: {
            radius: kmToPixels(orbitsKM.layer1Stations),
            period: (planets.mercury.period + planets.venus.period) / 2,
            count: 6
        },
        layer2: {
            radius: kmToPixels(orbitsKM.layer2Stations),
            period: (planets.venus.period + planets.earth.period) / 2,
            count: 6
        },
        layer3: {
            radius: kmToPixels(orbitsKM.layer3Stations),
            period: (planets.earth.period + planets.mars.period) / 2,
            count: 6
        },
        layer4: {
            radius: kmToPixels(orbitsKM.layer4Stations),
            period: 1.25 * planets.mars.period,
            count: 6
        },
        outer: {
            radius: kmToPixels(orbitsKM.outerStations),
            period: (planets.mars.period + planets.jupiter.period) / 2,
            count: 24
        }
    };

    function closestBody(body, orbitGroup, numberOffset = 0) {

        const stations = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup
        );

        if (stations.length === 0) return null;

        let closestIndex = 0;
        let closestDistance2 = Infinity;

        const tx = body.sprite.x;
        const ty = body.sprite.y;

        for (let i = 0; i < stations.length; i++) {

            const candidate = stations[i];

            const dx = candidate.sprite.x - tx;
            const dy = candidate.sprite.y - ty;

            const d2 = dx * dx + dy * dy;

            if (d2 < closestDistance2) {
                closestDistance2 = d2;
                closestIndex = i;
            }
        }

        // Wrap index around array length
        const targetIndex = (closestIndex + numberOffset) % stations.length;

        // Handle negative offsets
        return stations[(targetIndex + stations.length) % stations.length];
    }

    function closestBody2Orbits(orbitGroup1, orbitGroup2, numberOffset = 0){
        const bodies1 = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup1
        );

        const bodies2 = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup2
        );

        if (bodies1.length === 0 || bodies2.length === 0) return null;

        let closestBody1 = null;
        let closestBody2 = null;
        let closestDistance2 = Infinity;

        for (const body1 of bodies1) {
            for (const body2 of bodies2) {

                const dx = body2.sprite.x - body1.sprite.x;
                const dy = body2.sprite.y - body1.sprite.y;

                const d2 = dx * dx + dy * dy;

                if (d2 < closestDistance2) {
                    closestDistance2 = d2;
                    closestBody1 = body1;
                    closestBody2 = body2;
                }
            }
        }

        // Wrap index around array length
        const targetIndex = (bodies2.indexOf(closestBody2) + numberOffset) % bodies2.length;

        // Handle negative offsets
        return bodies2[(targetIndex + bodies2.length) % bodies2.length];
    }

    function createOrbit(name, radiusKm, options = {}) {

        const radius = kmToPixels(radiusKm);

        const orbit = new PIXI.Graphics();

        orbit
            .circle(0, 0, radius)
            .stroke({
                color: options.color ?? 0x000000,
                width: options.width ?? 0.5,
                alpha: options.opacity ?? 1
            });

        orbitLayer.addChild(orbit);

        let centerBody = null;

        if (options.centerBody) {
            centerBody = typeof options.centerBody === "string"
                ? bodies[options.centerBody]
                : options.centerBody;
        }

        paths[name] = {
            name,
            radius,
            centerBody,
            shape: orbit,

            color: options.color ?? 0x000000,
            opacity: options.opacity ?? 1,
            baseWidth: options.width ?? 0.5
        };

        return paths[name];
    }

    function redrawOrbit(orbit) {
        orbit.shape.clear();

        orbit.shape
            .circle(0, 0, orbit.radius)
            .stroke({
                color: orbit.color,
                width: Math.max(orbit.baseWidth / camera.zoom, 0.01),
                alpha: orbit.opacity
            });

    }

    function removeOrbit(name) {
        const orbit = paths[name];

        if (!orbit) {
            throw new Error(`Orbit "${name}" does not exist.`);
        }

        orbitLayer.removeChild(orbit.shape);
        delete paths[name];
    }

    function removeBody(name) {
        const body = bodies[name];

        if (!body) {
            throw new Error(`Body "${name}" does not exist.`);
        }

        bodyLayer.removeChild(body.sprite);
        labelLayer.removeChild(body.label);

        delete bodies[name];
    }

    let bodyClicked = null;

    function createBody(name, orbitName, periodDays, options = {}) {

        const orbit = paths[orbitName];

        if (!orbit) {
            throw new Error(`Orbit "${orbitName}" does not exist.`);
        }

        const body = new PIXI.Graphics();

        body
            .circle(0, 0, options.radius ?? 3)
            .fill(options.color ?? 0xffffff);

        body.interactive = true;
        body.on("pointerup", () => {
            moonMode = false;
            bodyClicked = name;
            console.log(`Body "${name}" focused`);
        });

        bodyLayer.addChild(body);

        const label = new PIXI.Text({
            text: options.label ?? name,
            style: {
                fontFamily: options.fontFamily ?? "Monospace",
                fontSize: options.fontSize ?? 10,
                fill: options.labelColor ?? 0x000000,
            },
            resolution: 10
        });

        label.anchor.set(0.1, 0.5);

        labelLayer.addChild(label);

        bodies[name] = {
            name,
            orbit,
            period: periodDays,
            offset: options.offset ?? 0,
            radius: options.radius ?? 4,
            sprite: body,
            label
        };

        return bodies[name];
    }

    function createLane(name, startingBody, options = {}) {
        const graphics = new PIXI.Graphics();

        laneLayer.addChild(graphics);

        const [dashlength, gapLength] = options.dash ?? [0, 0];

        const ts = new Float32Array(options.segments ?? 32);

        for (let i = 0; i < ts.length; i++) {
            ts[i] = i / (ts.length - 1);
        }

        lanes[name] = {
            name,

            graphics,

            startingBody: typeof startingBody === "string"
                ? bodies[startingBody]
                : startingBody,

            endingBody: null,

            color: options.color ?? 0x44ffff,

            width: options.width ?? 1,

            dashLength: dashlength,

            gapLength: gapLength,

            ts,
        };

        return lanes[name];
    }

    function lanePoint(A, B, t) {

        const dx = B.x - A.x;
        const dy = B.y - A.y;

        const distance = Math.hypot(dx, dy);

        if (distance === 0)
            return { x: A.x, y: A.y };

        // Curves naturally more as distance increases.
        const curve = 0.35 * (1 - Math.exp(-distance / 250));

        const mx = (A.x + B.x) * 0.5;
        const my = (A.y + B.y) * 0.5;

        const nx = -dy / distance;
        const ny = dx / distance;

        const cx = mx + nx * distance * curve;
        const cy = my + ny * distance * curve;

        const u = 1 - t;

        return {
            x:
                u*u*A.x +
                2*u*t*cx +
                t*t*B.x,

            y:
                u*u*A.y +
                2*u*t*cy +
                t*t*B.y
        };
    }

    function updateLane(name, endingBody, startingBody = null) {

        if(startingBody !== null) {
            lanes[name].startingBody = startingBody;
        }

        const lane = lanes[name];

        if(!lane) throw new Error(`Lane "${name}" does not exist.`);
        if(!endingBody) throw new Error(`Ending body for lane "${name}" does not exist.`);

        const g = lane.graphics;

        g.clear();

        const p1 = lane.startingBody.sprite.position;
        const p2 = endingBody.sprite.position;

        const r1 = Math.hypot(p1.x, p1.y);
        const r2 = Math.hypot(p2.x, p2.y);

        const a1 = Math.atan2(p1.y, p1.x);
        const a2 = Math.atan2(p2.y, p2.x);

        let delta = a2 - a1;

        while (delta > Math.PI) delta -= TAU;
        while (delta < -Math.PI) delta += TAU;

        const dr = r2 - r1;

        const pts = [];

        for (const t of lane.ts) {

            const r = r1 + dr * t;
            const a = a1 + delta * t;

            pts.push({
                x: r * Math.cos(a),
                y: r * Math.sin(a)
            });
        }

        const dash = lane.dashLength;
        const gap = lane.gapLength;
        const pattern = dash + gap;

        let travelled = 0;

        for (let i = 0; i < pts.length - 1; i++) {

            const p0 = pts[i];
            const p1 = pts[i + 1];

            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;

            const length = Math.hypot(dx, dy);

            if (length === 0) continue;

            const ux = dx / length;
            const uy = dy / length;

            let local = 0;

            while (local < length) {

                const phase = travelled % pattern;

                if (phase < dash) {

                    const drawLength = Math.min(
                        dash - phase,
                        length - local
                    );

                    g.moveTo(
                        p0.x + ux * local,
                        p0.y + uy * local
                    );

                    g.lineTo(
                        p0.x + ux * (local + drawLength),
                        p0.y + uy * (local + drawLength)
                    );

                    local += drawLength;
                    travelled += drawLength;

                } else {

                    const skipLength = Math.min(
                        pattern - phase,
                        length - local
                    );

                    local += skipLength;
                    travelled += skipLength;

                }
            }
        }

        g.stroke({
            color: lane.color,
            width: lane.width / camera.zoom
        });
    }

    let moonMode = false;

    function togglePause(){
        paused = !paused;
        refreshControls()
        console.log(`Simulation ${paused ? "paused" : "resumed"}`);
    }

    function increaseSpeed(faster = false){
        DAYS_PER_SECOND += faster ? 10 : 1;
        refreshControls()
        console.log(`Days per second: ${DAYS_PER_SECOND}`);
    }

    function decreaseSpeed(faster){
        DAYS_PER_SECOND -= faster ? 10 : 1;
        DAYS_PER_SECOND = Math.max(1, DAYS_PER_SECOND);
        refreshControls()
        console.log(`Days per second: ${DAYS_PER_SECOND}`);
    }

    window.addEventListener("keydown", e => {
        switch (e.code) {
            case "Space": {
                e.preventDefault();
                togglePause();
            } break;

            case "ArrowUp": {
                e.preventDefault();
                increaseSpeed(e.shiftKey);
            } break;

            case "ArrowDown": {
                e.preventDefault();
                decreaseSpeed(e.shiftKey);
            } break;
        }
    });

    let dragging = false;
    let lastMouse = { x: 0, y: 0 };

    let pointerDown = false;

    app.canvas.addEventListener("pointerdown", e => {

        pointerDown = true;

        lastMouse.x = e.clientX;
        lastMouse.y = e.clientY;

    if (e.target === app.canvas && bodyClicked) {
        const body = bodies[bodyClicked];

        camera.x = body.sprite.x;
        camera.y = body.sprite.y;

        bodyClicked = null;
    }

        app.canvas.setPointerCapture(e.pointerId);

    });

    app.canvas.addEventListener("pointerup", (e) => {
        pointerDown = false;

        touches.delete(e.pointerId);
        previousDistance = 0;
    });

    app.canvas.addEventListener("pointermove", e => {

        if(!pointerDown) return;

        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;

        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;

        lastMouse.x = e.clientX;
        lastMouse.y = e.clientY;

        updateCamera();
    });

    app.canvas.addEventListener("wheel", e => {
        e.preventDefault();

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        // World coordinates before zoom
        const worldX =
            camera.x +
            (mouseX - app.renderer.width / 2) / camera.zoom;

        const worldY =
            camera.y +
            (mouseY - app.renderer.height / 2) / camera.zoom;

        const factor = Math.exp(-e.deltaY * 0.001);

        camera.zoom *= factor;

        camera.zoom = Math.max(0.0025, Math.min(100, camera.zoom));

        // Keep mouse pointing at same world location
        camera.x =
            worldX -
            (mouseX - app.renderer.width / 2) / camera.zoom;

        camera.y =
            worldY -
            (mouseY - app.renderer.height / 2) / camera.zoom;

        updateCamera();

    }, { passive: false });

    const touches = new Map();

    function distance(a,b){
        return Math.hypot(
            a.clientX-b.clientX,
            a.clientY-b.clientY
        );
    }

    let previousDistance = 0;

    app.canvas.addEventListener("pointerdown", e => {
        if(e.pointerType==="touch") touches.set(e.pointerId, e);
    });

    app.canvas.addEventListener("pointermove", e => {
        if(e.pointerType!=="touch") return;

        touches.set(e.pointerId, e);

        if(touches.size!==2) return;

        const [a, b] = [...touches.values()];

        const d = distance(a, b);

        if(previousDistance){

            const factor = d / previousDistance;

            camera.zoom *= factor;

            camera.zoom = Math.max(.0025, Math.min(100, camera.zoom));

            updateCamera();
        }

        previousDistance = d;
    });

    function updateBodies() {
        for (const body of Object.values(bodies)) {

            const angle = TAU * (
                days / body.period +
                body.offset
            );

            let centerX = 0;
            let centerY = 0;

            if (body.orbit.centerBody) {
                centerX = body.orbit.centerBody.sprite.x;
                centerY = body.orbit.centerBody.sprite.y;
            }

            body.sprite.position.set(
                centerX + body.orbit.radius * Math.cos(angle),
                centerY + body.orbit.radius * Math.sin(angle)
            );
        }

        // Move satellite orbit graphics
        for (const orbit of Object.values(paths)) {

            if (!orbit.centerBody) continue;

            orbit.shape.position.copyFrom(
                orbit.centerBody.sprite.position
            );
        }
    }

    function updateCamera() {

        let pivotX = camera.x;
        let pivotY = camera.y;

        if (bodyClicked) {
            const body = bodies[bodyClicked];

            if (body) {
                pivotX = body.sprite.x;
                pivotY = body.sprite.y;
            }
        }

        world.pivot.set(pivotX, pivotY);

        world.position.set(
            app.renderer.width / 2,
            app.renderer.height / 2
        );

        world.scale.set(camera.zoom);

        for (const body of Object.values(bodies)) {
            body.sprite.scale.set(Math.max(1 / camera.zoom, 1.1));

            const labelScale = 1 / camera.zoom;

            // const labelScale = Math.min(
            //     Math.max(1 / camera.zoom, 0.5),
            //     3
            // );

            // make the label transparent if the zoom is less than 5
            // exclude main bodies, and ITA 0-5, O stations
            if(camera.zoom < 0.6 && !["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune"].includes(body.name) && !body.name.startsWith("O") && !body.name.startsWith("0") && !body.name.startsWith("1") && !body.name.startsWith("2") && !body.name.startsWith("3") && !body.name.startsWith("4") && !body.name.startsWith("5")) {
                body.label.alpha = 0;
            } else {
                body.label.alpha = 1;
            }

            body.label.scale.set(labelScale);

            body.label.position.set(
                body.sprite.x + (body.radius + 4) / camera.zoom,
                body.sprite.y
            );
        }

        for (const orbit of Object.values(paths)) {
            redrawOrbit(orbit);
        }
    }
        
    app.ticker.add(() => {

        const deltaSeconds = app.ticker.deltaMS / 1000;

        if (!paused) {
            days += deltaSeconds * DAYS_PER_SECOND;
        }

        if (updateBodiesAndLanes) {
            updateBodies();
            updateLanes();
        }

        updateCamera();

    });

    function createOrbits(){
        createOrbit("mercury", orbitsKM.mercury);
        createOrbit("venus",    orbitsKM.venus,  );
        createOrbit("earth",    orbitsKM.earth,  );
        createOrbit("mars",     orbitsKM.mars,   );
        createOrbit("jupiter",  orbitsKM.jupiter,);
        createOrbit("saturn",   orbitsKM.saturn, );
        createOrbit("uranus",   orbitsKM.uranus, );
        createOrbit("neptune",  orbitsKM.neptune,);

        createOrbit("innerAsteroidBelt", orbitsKM.asteroidBeltInner, { color: 0x7A84B6, width: 1 });
        createOrbit("outerAsteroidBelt", orbitsKM.asteroidBeltOuter, { color: 0x7A84B6, width: 1 });

        createOrbit("layer1Stations", orbitsKM.layer1Stations, { color: colors.layerStation, width: 0.5 });
        createOrbit("layer2Stations", orbitsKM.layer2Stations, { color: colors.layerStation, width: 0.5 });
        createOrbit("layer3Stations", orbitsKM.layer3Stations, { color: colors.layerStation, width: 0.5 });
        createOrbit("layer4Stations", orbitsKM.layer4Stations, { color: colors.layerStation, width: 0.5 });

        createOrbit("outerStations", orbitsKM.outerStations, { color: colors.layerStation, width: 0.5 });
    }
 


    const colors = {
        layerStation: 0xbfbfbf
    }


    function createPlanets(size){
        createBody("mercury", "mercury", planets.mercury.period, { color: planets.mercury.color, radius: size });
        createBody("venus", "venus", planets.venus.period, { color: planets.venus.color, radius: size });

    function createMoons(moonSize) {
        for (const [moonName, moonData] of Object.entries(moons)) {
            const orbitName = moonData.orbit;
            const centerBodyName = moonData.centerBody;

            createOrbit(
                orbitName,
                moonData.distance * MOON_SCALAR,
                { color: 0x000000, width: moonOrbitWidth, centerBody: centerBodyName }
            );

            createBody(
                moonName,
                orbitName,
                moonData.period,
                { color: moonData.color, radius: moonSize }
            );
        }
    }

    function updateLanes(){
        updateLane("earthMars", closestBody(bodies.earth, "mars"));
        updateLane("mercuryVenus", closestBody(bodies.mercury, "venus"));

        [
            ["mercury", "layer1Stations", "mercury1"],
            ["venus",   "layer1Stations", "venus1"],
            ["venus",   "layer2Stations", "venus2"],
            ["earth",   "layer2Stations", "earth1"],
            ["earth",   "layer3Stations", "earth2"],
            ["mars",    "layer3Stations", "mars1"],
            ["mars",    "layer4Stations", "mars2"],
        ].forEach(([from, group, lane]) => {
            updateLane(lane, closestBody(bodies[from], group));
        });

        for (let i = 1; i <= 6; i++) {
            updateLane(
                `2${i}To1`,
                closestBody(bodies[`2${i}`], "layer1Stations")
            );
        }

        for (let i = 1; i <= 6; i++) {
            updateLane(
                `3${i}To2`,
                closestBody(bodies[`3${i}`], "layer2Stations")
            );
        };

        for(let i = 1; i <= 6; i++) {
            updateLane(
                `4${i}To3`,
                closestBody(bodies[`4${i}`], "layer3Stations")
            );
        };

        for(let i = 1; i <= 6; i++) {
            updateLane(
                `3${i}To2Offset`,
                closestBody(bodies[`3${i}`], "layer2Stations", -1)
            );
        }

        for(let i = 1; i <= 6; i++) {
            updateLane(
                `4${i}To3Offset`,
                closestBody(bodies[`4${i}`], "layer3Stations", -1)
            );
        }


        for(let i = 1; i <= 6; i++) {
            updateLane(`4${i}ToOuter1`, closestBody(bodies[`4${i}`], "outerStations", -1));
            updateLane(`4${i}ToOuter2`, closestBody(bodies[`4${i}`], "outerStations"));
            updateLane(`4${i}ToOuter3`, closestBody(bodies[`4${i}`], "outerStations", 1));
        }


        updateLane("OuterToUranus",  closestBody2Orbits("uranusStationOrbit", "outerStations"), closestBody2Orbits("outerStations", "uranusStationOrbit"));
        updateLane("OuterToJupiter", closestBody2Orbits("jupiterStationOrbit", "outerStations"), closestBody2Orbits("outerStations", "jupiterStationOrbit"));
        updateLane("OuterToSaturn",  closestBody2Orbits("saturnStationOrbit", "outerStations"), closestBody2Orbits("outerStations", "saturnStationOrbit"));
    }

    function resetAll(){
        for (const name of Object.keys(paths)) {
            removeOrbit(name);
        }

        for (const name of Object.keys(bodies)) {
            removeBody(name);
        }

        for (const name of Object.keys(lanes)) {
            laneLayer.removeChild(lanes[name].graphics);
            delete lanes[name];
        }
    }


    createOrbits();
    createPlanets(planetSize);
    createMoons(moonSize);
    createStations(stationSize);
    createLanes(minorLaneDash, majorLaneDash);
    realisticModeOnly(0.1)


    updateCamera();
</script>
