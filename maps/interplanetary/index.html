    } else if (e.key === "ArrowDown") {
        DAYS_PER_SECOND -= e.shiftKey ? 10 : 1;
        if(DAYS_PER_SECOND < 1) DAYS_PER_SECOND = 1;
        timeElement.textContent = DAYS_PER_SECOND;

const kmToPixels = km => kmToAU(km) * PixelsPerAU;

const paths = {};

function getAllBodiesOfPath(pathName) {
    return Object.values(bodies).filter(body => body.path.name === pathName);
}

function addOrbit(name, radiusKm, options = {}) {

    const radius = kmToPixels(radiusKm);

    const circle = two.makeCircle(0, 0, radius);

    circle.noFill();
    circle.stroke = options.color ?? "#444";
    circle.linewidth = options.width ?? 1;
    circle.opacity = options.opacity ?? 1;

    world.add(circle);

    paths[name] = {
        name,
        radius,
        shape: circle
    };

    return paths[name];
}

function addBody(name, pathName, periodDays, options = {}) {

    const path = paths[pathName];

    if (!path) {
        throw new Error(`Orbit "${pathName}" does not exist.`);
    }

    const planet = two.makeCircle(
        path.radius,
        0,
        options.radius ?? PLANET_RADIUS
    );

    planet.fill = options.color ?? "white";
    planet.stroke = "black";
    planet.linewidth = 0.5;

    world.add(planet);

    const label = new Two.Text(
        options.label ?? name,
        path.radius,
        0
    );

    label.fill = options.labelColor ?? "black";
    label.stroke = "none";
    label.linewidth = 0.1;
    label.size = options.labelSize ?? 12;
    label.family = options.labelFont ?? "Arial";
    label.alignment = options.labelAlignment ?? "left";
    label.baseline = options.labelBaseline ?? "middle";

    world.add(label);

    bodies[name] = {
        name,
        path,
        period: periodDays,
        offset: options.offset ?? 0,
        planet,
        radius: options.radius ?? PLANET_RADIUS,
        label,
    };

    return bodies[name];
}

function addSatelliteOrbit(parentName, name, distanceKM, options = {}) {

    const parent = bodies[parentName];

    if (!parent) {
        throw new Error(`Parent body "${parentName}" does not exist.`);
    }

    const radius = kmToPixels(distanceKM);

    const orbit = two.makeCircle(
        parent.planet.translation.x,
        parent.planet.translation.y,
        radius
    );

    orbit.noFill();
    orbit.stroke = options.color ?? "#444";
    orbit.linewidth = options.width ?? 1;
    orbit.opacity = options.opacity ?? 1;

    world.add(orbit);

    paths[name] = {
        name,
        radius,
        parent,
        satelliteOrbit: true,
        shape: orbit
    };

    return paths[name];
}

function closestBody(body, orbitGroup) {
    let closest = null;
    let closestDistance2 = Infinity;

    const tx = body.planet.translation.x;
    const ty = body.planet.translation.y;

    for (const candidate of Object.values(bodies)) {

        if (candidate.path.name !== orbitGroup) continue;

        const dx = candidate.planet.translation.x - tx;
        const dy = candidate.planet.translation.y - ty;

        const d2 = dx * dx + dy * dy;

        if (d2 < closestDistance2) {
            closestDistance2 = d2;
            closest = candidate;
        }
    }

    return closest;
}

const TAU = Math.PI * 2;

function makeLane(body1, body2, options = {}) {

    // get the distance between the two bodies

    // const dist = body2 ? Math.hypot(
    //     body2.planet.translation.x - body1.planet.translation.x,
    //     body2.planet.translation.y - body1.planet.translation.y
    // ) : 0;

    // figure out how many segments to use based on the distance, with a minimum of 1 and a maximum of 10

    const segments = options.segments ?? 10;

    const vertices = Array.from(
        { length: segments + 1 },
        () => new Two.Anchor()
    );

    // Precompute t values once
    const ts = new Float32Array(segments + 1);
    for (let i = 0; i <= segments; i++) {
        ts[i] = i / segments;
    }

    const path = new Two.Path(vertices);

    path.noFill();
    path.stroke = options.color ?? "white";
    path.linewidth = options.width ?? 1;
    path.dashes = options.dashes ?? [];
    path.opacity = options.opacity ?? 1;

    path.curved = false;
    path.closed = false;

    world.add(path);

    path.update = (newBody2) => {

        if (!newBody2) return;

        const p1 = body1.planet.translation;
        const p2 = newBody2.planet.translation;

        const r1 = Math.hypot(p1.x, p1.y);
        const r2 = Math.hypot(p2.x, p2.y);

        const a1 = Math.atan2(p1.y, p1.x);
        const a2 = Math.atan2(p2.y, p2.x);

        let delta = a2 - a1;

        while (delta > Math.PI) delta -= TAU;
        while (delta < -Math.PI) delta += TAU;

        const dr = r2 - r1;

        for (let i = 0; i <= segments; i++) {

            const t = ts[i];

            const r = r1 + dr * t;
            const a = a1 + delta * t;

            const v = vertices[i];

            v.x = r * Math.cos(a);
            v.y = r * Math.sin(a);
        }

        path._flagVertices = true;
    };

    world.remove(path);
    world.children.splice(1, 0, path);
    world._flagOrder = true;

    lanePaths.push(path);

    return path;
}

function makeDonut(innerRadius, outerRadius, segments = 128, options = {}) {
    const vertices = [];

    // Outer loop
    for (let i = 0; i < segments + 1; i++) {
        const a = (i / segments) * Math.PI * 2;

        vertices.push(
            new Two.Anchor(
                Math.cos(a) * outerRadius,
                Math.sin(a) * outerRadius
            )
        );
    }

    // Inner loop reversed
    for (let i = segments; i >= 0; i--) {
        const a = (i / segments) * Math.PI * 2;

        vertices.push(
            new Two.Anchor(
                Math.cos(a) * innerRadius,
                Math.sin(a) * innerRadius
            )
        );
    }

    const donut = two.makePath(vertices, true);

    donut.fill = options.fill ?? "rgb(0,0,0, 0.4)";
    donut.stroke = options.stroke ?? "rgb(0,0,0,0)";
    donut.linewidth = 1;

    world.add(donut);

    return donut;
}

}

addOrbit("layer3Stations", orbitsKM.layer3Stations, { color: "grey", opacity: 0.2 });
for(let i = 0; i < stations.layer3.count; i++) {

}

addOrbit("layer4Stations", orbitsKM.layer4Stations, { color: "grey", opacity: 0.2 });

    addBody(`O${i+1}`, "outerStations", stations.outer.period, { color: "grey", offset, radius: 2 });

    ],

        makeLane(layer2Stations[0], undefined, { color: laneColors.station2To3Offset, width: 2, dashes: stationLaneDashes }),

    earthMars: makeLane(bodies.earth, bodies.mars, { color: laneColors.earthMars, width: 2, dashes: [5,5], segments: 32 }),
    mercuryVenus: makeLane(bodies.mercury, bodies.venus, { color: laneColors.mercuryVenus, width: 2, dashes: [5,5], segments: 32 }),
};


let fps = 0;
let frames = 0;
let fpsTime = performance.now();
let lastTime = performance.now();

two.bind("update", () => {

    const now = performance.now();
    const deltaSeconds = (now - lastTime) / 1000;
    lastTime = now;

    frames++;

    if (now - fpsTime >= 1000) {
        fps = frames;
        frames = 0;
        fpsTime = now;

        fpsCounter.textContent = fps.toString().padStart(2, "0");
    }

    if (!camera.paused) {
        days += deltaSeconds * DAYS_PER_SECOND;        
       
    }

    for (const path of Object.values(paths)) {
        if (path.satelliteOrbit) {

            path.shape.translation.set(
                path.parent.planet.translation.x,
                path.parent.planet.translation.y
            );

        }
    }

    for (const body of Object.values(bodies)) {

        const angle = 2 * Math.PI * (
            days / body.period +
            body.offset
        );

        let x;
        let y;

        if (body.satellite) {

            x = body.parent.planet.translation.x +
                body.distance * Math.cos(angle);

            y = body.parent.planet.translation.y +
                body.distance * Math.sin(angle);

        } else {

            x = body.path.radius * Math.cos(angle);
            y = body.path.radius * Math.sin(angle);

        }

        body.planet.translation.set(x, y);

        body.label.translation.set(
            x + body.radius + 4,
            y
        );
    }

    lanes.mercury[0].update(closestBody(bodies.mercury, "layer1Stations"));

    lanes.venus[0].update(closestBody(bodies.venus, "layer1Stations"));
    lanes.venus[1].update(closestBody(bodies.venus, "layer2Stations"));

    lanes.earth[0].update(closestBody(bodies.earth, "layer2Stations"));
    lanes.earth[1].update(closestBody(bodies.earth, "layer3Stations"));

    lanes.mars[0].update(closestBody(bodies.mars, "layer3Stations"));
    lanes.mars[1].update(closestBody(bodies.mars, "layer4Stations"));

    lanes.earthMars.update(bodies.mars);
    lanes.mercuryVenus.update(bodies.venus);

    lanes.layer1To2.forEach((lane, index) => {
        lane.update(closestBody(layer1Stations[index], "layer2Stations"));
    });

    lanes.layer2To3.forEach((lane, index) => {
        lane.update(closestBody(layer2Stations[index], "layer3Stations"));
    });

    lanes.layer3To4.forEach((lane, index) => {
        lane.update(closestBody(layer3Stations[index], "layer4Stations"));
    });

    const next3To4 =
    ((Number(closestBody(layer3Stations[0], "layer4Stations").name) - 41 + 1) % 6) + 41;

    lanes.layer3To4Offset.forEach((lane, index) => {
        const station = ((next3To4 - 41 + index) % 6) + 41;
        lane.update(bodies[station]);
    });

    const next2To3 =
    ((Number(closestBody(layer2Stations[0], "layer3Stations").name) - 31 + 1) % 6) + 31;

    lanes.layer2To3Offset.forEach((lane, index) => {
        const station = ((next2To3 - 31 + index) % 6) + 31;
        lane.update(bodies[station]);
    });
});

updateCamera();
