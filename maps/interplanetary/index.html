    function closestBody(body, orbitGroup, numberOffset = 0) {

        const stations = Object.values(bodies).filter(
            candidate => candidate.orbit.name === orbitGroup
        );

        if (stations.length === 0) return null;

        let closestIndex = 0;
        let closestDistance2 = Infinity;

        const tx = body.sprite.x;
        const ty = body.sprite.y;

        for (let i = 0; i < stations.length; i++) {

            const candidate = stations[i];

            const dx = candidate.sprite.x - tx;
            const dy = candidate.sprite.y - ty;

            const d2 = dx * dx + dy * dy;

            if (d2 < closestDistance2) {
                closestDistance2 = d2;
                closestIndex = i;
            }
        }

        // Wrap index around array length
        const targetIndex = (closestIndex + numberOffset) % stations.length;

        // Handle negative offsets
        return stations[(targetIndex + stations.length) % stations.length];
    }

    function createOrbit(name, radiusKm, options = {}) {

        const radius = kmToPixels(radiusKm);

        const orbit = new PIXI.Graphics();

        orbit
            .circle(0, 0, radius)
            .stroke({
                color: options.color ?? 0x000000,
                width: options.width ?? 0.5,
                alpha: options.opacity ?? 1
            });

        orbitLayer.addChild(orbit);

        let centerBody = null;

        if (options.centerBody) {
            centerBody = typeof options.centerBody === "string"
                ? bodies[options.centerBody]
                : options.centerBody;
        }

        paths[name] = {
            name,
            radius,
            centerBody,
            shape: orbit,

            color: options.color ?? 0x000000,
            opacity: options.opacity ?? 1,
            baseWidth: options.width ?? 0.5
        };

        return paths[name];
    }

    function redrawOrbit(orbit) {
        orbit.shape.clear();

        orbit.shape
            .circle(0, 0, orbit.radius)
            .stroke({
                color: orbit.color,
                width: Math.max(orbit.baseWidth / camera.zoom, 0.1),
                alpha: orbit.opacity
            });

    }

    function removeOrbit(name) {
        const orbit = paths[name];

        if (!orbit) {
            throw new Error(`Orbit "${name}" does not exist.`);
        }

        orbitLayer.removeChild(orbit.shape);
        delete paths[name];
    }

    function removeBody(name) {
        const body = bodies[name];

        if (!body) {
            throw new Error(`Body "${name}" does not exist.`);
        }

        bodyLayer.removeChild(body.sprite);
        labelLayer.removeChild(body.label);

        delete bodies[name];
    }

    let bodyClicked = null;

    function createBody(name, orbitName, periodDays, options = {}) {

        const orbit = paths[orbitName];

        if (!orbit) {
            throw new Error(`Orbit "${orbitName}" does not exist.`);
        }

        const body = new PIXI.Graphics();

        body
            .circle(0, 0, options.radius ?? 3)
            .fill(options.color ?? 0xffffff);

        body.interactive = true;
        body.on("pointerup", () => {
            moonMode = false;
            bodyClicked = name;
            console.log(`Body "${name}" focused`);
        });

        bodyLayer.addChild(body);

        const label = new PIXI.Text({
            text: options.label ?? name,
            style: {
                fontFamily: options.fontFamily ?? "Monospace",
                fontSize: options.fontSize ?? 10,
                fill: options.labelColor ?? 0x000000,
            },
            resolution: 10
        });

        label.anchor.set(0.1, 0.5);

        labelLayer.addChild(label);

        bodies[name] = {
            name,
            orbit,
            period: periodDays,
            offset: options.offset ?? 0,
            radius: options.radius ?? 4,
            sprite: body,
            label
        };

        return bodies[name];
    }

    function createLane(name, startingBody, options = {}) {
        const graphics = new PIXI.Graphics();

        laneLayer.addChild(graphics);

        const [dashlength, gapLength] = options.dash ?? [0, 0];

        const ts = new Float32Array(options.segments ?? 32);

        for (let i = 0; i < ts.length; i++) {
            ts[i] = i / (ts.length - 1);
        }

        lanes[name] = {
            name,

            graphics,

            startingBody: typeof startingBody === "string"
                ? bodies[startingBody]
                : startingBody,

            endingBody: null,

            color: options.color ?? 0x44ffff,

            width: options.width ?? 1,

            dashLength: dashlength,

            gapLength: gapLength,

            ts,
        };

        return lanes[name];
    }

    function lanePoint(A, B, t) {

        const dx = B.x - A.x;
        const dy = B.y - A.y;

        const distance = Math.hypot(dx, dy);

        if (distance === 0)
            return { x: A.x, y: A.y };

        // Curves naturally more as distance increases.
        const curve = 0.35 * (1 - Math.exp(-distance / 250));

        const mx = (A.x + B.x) * 0.5;
        const my = (A.y + B.y) * 0.5;

        const nx = -dy / distance;
        const ny = dx / distance;

        const cx = mx + nx * distance * curve;
        const cy = my + ny * distance * curve;

        const u = 1 - t;

        return {
            x:
                u*u*A.x +
                2*u*t*cx +
                t*t*B.x,

            y:
                u*u*A.y +
                2*u*t*cy +
                t*t*B.y
        };
    }

    function updateLane(name, endingBody) {

        const lane = lanes[name];

        if(!lane) throw new Error(`Lane "${name}" does not exist.`);
        if(!endingBody) throw new Error(`Ending body for lane "${name}" does not exist.`);

        const g = lane.graphics;

        g.clear();

        const p1 = lane.startingBody.sprite.position;
        const p2 = endingBody.sprite.position;

        const r1 = Math.hypot(p1.x, p1.y);
        const r2 = Math.hypot(p2.x, p2.y);

        const a1 = Math.atan2(p1.y, p1.x);
        const a2 = Math.atan2(p2.y, p2.x);

        let delta = a2 - a1;

        while (delta > Math.PI) delta -= TAU;
        while (delta < -Math.PI) delta += TAU;

        const dr = r2 - r1;

        const pts = [];

        for (const t of lane.ts) {

            const r = r1 + dr * t;
            const a = a1 + delta * t;

            pts.push({
                x: r * Math.cos(a),
                y: r * Math.sin(a)
            });
        }

        const dash = lane.dashLength;
        const gap = lane.gapLength;
        const pattern = dash + gap;

        let travelled = 0;

        for (let i = 0; i < pts.length - 1; i++) {

            const p0 = pts[i];
            const p1 = pts[i + 1];

            const dx = p1.x - p0.x;
            const dy = p1.y - p0.y;

            const length = Math.hypot(dx, dy);

            if (length === 0) continue;

            const ux = dx / length;
            const uy = dy / length;

            let local = 0;

            while (local < length) {

                const phase = travelled % pattern;

                if (phase < dash) {

                    const drawLength = Math.min(
                        dash - phase,
                        length - local
                    );

                    g.moveTo(
                        p0.x + ux * local,
                        p0.y + uy * local
                    );

                    g.lineTo(
                        p0.x + ux * (local + drawLength),
                        p0.y + uy * (local + drawLength)
                    );

                    local += drawLength;
                    travelled += drawLength;

                } else {

                    const skipLength = Math.min(
                        pattern - phase,
                        length - local
                    );

                    local += skipLength;
                    travelled += skipLength;

                }
            }
        }

        g.stroke({
            color: lane.color,
            width: lane.width / camera.zoom
        });
    }

    let moonMode = false;

    window.addEventListener("keydown", e => {
        switch (e.code) {
            case "Space": {
                e.preventDefault();
                paused = !paused;
                console.log(`Simulation ${paused ? "paused" : "resumed"}`);
            } break;

            case "ArrowUp": {
                e.preventDefault();
                DAYS_PER_SECOND += e.shiftKey ? 10 : 1;
                console.log(`Days per second: ${DAYS_PER_SECOND}`);
            } break;

            case "ArrowDown": {
                e.preventDefault();
                DAYS_PER_SECOND -= e.shiftKey ? 10 : 1;
                DAYS_PER_SECOND = Math.max(1, DAYS_PER_SECOND);
                console.log(`Days per second: ${DAYS_PER_SECOND}`);
            } break;

            case "KeyE": {
                moonMode = !moonMode;
            } break;
        }
    });

    let dragging = false;
    let lastMouse = { x: 0, y: 0 };

    app.canvas.addEventListener("mousedown", e => {
        dragging = true;
        lastMouse.x = e.clientX;
        lastMouse.y = e.clientY;

        if(bodyClicked != null) {
            console.log(`${bodyClicked} was unfocused`);
            bodyClicked = null;
            moonMode = false;
        }
    });

    window.addEventListener("mouseup", () => {
        dragging = false;
    });

    window.addEventListener("mousemove", e => {
        if (!dragging) return;

        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;

        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;

        lastMouse.x = e.clientX;
        lastMouse.y = e.clientY;

        updateCamera();
    });

    app.canvas.addEventListener("wheel", e => {
        e.preventDefault();

        const mouseX = e.clientX;
        const mouseY = e.clientY;

        // World coordinates before zoom
        const worldX =
            camera.x +
            (mouseX - app.renderer.width / 2) / camera.zoom;

        const worldY =
            camera.y +
            (mouseY - app.renderer.height / 2) / camera.zoom;

        const factor = Math.exp(-e.deltaY * 0.001);

        camera.zoom *= factor;

        camera.zoom = Math.max(0.05, Math.min(100, camera.zoom));

        // Keep mouse pointing at same world location
        camera.x =
            worldX -
            (mouseX - app.renderer.width / 2) / camera.zoom;

        camera.y =
            worldY -
            (mouseY - app.renderer.height / 2) / camera.zoom;

        updateCamera();

    }, { passive: false });

    function updateBodies() {
        for (const body of Object.values(bodies)) {

            const angle = TAU * (
                days / body.period +
                body.offset
            );

            let centerX = 0;
            let centerY = 0;

            if (body.orbit.centerBody) {
                centerX = body.orbit.centerBody.sprite.x;
                centerY = body.orbit.centerBody.sprite.y;
            }

            body.sprite.position.set(
                centerX + body.orbit.radius * Math.cos(angle),
                centerY + body.orbit.radius * Math.sin(angle)
            );

            body.label.position.set(
                body.sprite.x + body.radius + 4,
                body.sprite.y
            );
        }

        // Move satellite orbit graphics
        for (const orbit of Object.values(paths)) {

            if (!orbit.centerBody) continue;

            orbit.shape.position.copyFrom(
                orbit.centerBody.sprite.position
            );
        }
    }
    
    function updateCamera() {

        world.position.set(
            app.renderer.width / 2 - camera.x * camera.zoom,
            app.renderer.height / 2 - camera.y * camera.zoom
        );

        world.scale.set(camera.zoom);


        for (const body of Object.values(bodies)) {
            body.sprite.scale.set(Math.max(1 / camera.zoom, 1.1));

            const labelScale = Math.min(
                Math.max(1 / camera.zoom, 0.5),
                3
            );

            body.label.scale.set(labelScale);
        }

        for (const orbit of Object.values(paths)) {
            redrawOrbit(orbit);
        }
    }
        
    app.ticker.add(() => {
        const deltaSeconds = app.ticker.deltaMS / 1000;

        if (!paused) {
            days += deltaSeconds * DAYS_PER_SECOND;
        }

        if (bodyClicked != null) {
            const body = bodies[bodyClicked];

            if (body) {
                camera.x = body.sprite.x;
                camera.y = body.sprite.y;
            }

            updateCamera();
        }

        if(updateBodiesAndLanes) {
            updateBodies();
            updateLanes();
        }
    });

    function createMoons() {
        for (const [moonName, moonData] of Object.entries(moons)) {
            const orbitName = moonData.orbit;
            const centerBodyName = moonData.centerBody;

            createOrbit(
                orbitName,
                moonData.distance * MOON_SCALAR,
                { color: 0x000000, width: 0.1, centerBody: centerBodyName }
            );

            createBody(
                moonName,
                orbitName,
                moonData.period,
                { color: moonData.color, radius: 0.4 }
            );
        }
    }

    function createStations() {
        for(let i = 0; i < stations.layer1.count; i++) {
            const offset = i / stations.layer1.count;
            createBody(`1${i+1}`, "layer1Stations", stations.layer1.period, { offset, radius: 0.6, color: colors.layerStation });
        }

        for(let i = 0; i < stations.layer2.count; i++) {
            const offset = i / stations.layer2.count;
            createBody(`2${i+1}`, "layer2Stations", stations.layer2.period, { offset, radius: 0.6, color: colors.layerStation });
        }

        for(let i = 0; i < stations.layer3.count; i++) {
            const offset = i / stations.layer3.count;
            createBody(`3${i+1}`, "layer3Stations", stations.layer3.period, { offset, radius: 0.6, color: colors.layerStation });
        }

        for(let i = 0; i < stations.layer4.count; i++) {
            const offset = i / stations.layer4.count;
            createBody(`4${i+1}`, "layer4Stations", stations.layer4.period, { offset, radius: 0.6, color: colors.layerStation });
        }

    function updateLanes(){
        updateLane("earthMars", closestBody(bodies.earth, "mars"));
        updateLane("mercuryVenus", closestBody(bodies.mercury, "venus"));

        [
            ["mercury", "layer1Stations", "mercury1"],
            ["venus",   "layer1Stations", "venus1"],
            ["venus",   "layer2Stations", "venus2"],
            ["earth",   "layer2Stations", "earth1"],
            ["earth",   "layer3Stations", "earth2"],
            ["mars",    "layer3Stations", "mars1"],
            ["mars",    "layer4Stations", "mars2"],
        ].forEach(([from, group, lane]) => {
            updateLane(lane, closestBody(bodies[from], group));
        });

        for (let i = 1; i <= 6; i++) {
            updateLane(
                `2${i}To1`,
                closestBody(bodies[`2${i}`], "layer1Stations")
            );
        }

        for (let i = 1; i <= 6; i++) {
            updateLane(
                `3${i}To2`,
                closestBody(bodies[`3${i}`], "layer2Stations")
            );
        };

        for(let i = 1; i <= 6; i++) {

                `4${i}To3`,

            );
        };

        for(let i = 1; i <= 6; i++) {
            updateLane(
                `3${i}To2Offset`,
                closestBody(bodies[`3${i}`], "layer2Stations", -1)
            );
        }

        for(let i = 1; i <= 6; i++) {

                `4${i}To3Offset`,
