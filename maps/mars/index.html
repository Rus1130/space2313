<script>
    function blankLabel(count){
        return Array.from({length: count}, (_, i) => ({}));
    }

    const sources = {
        base: "src/baseMap.png",
        cities: {
            argyre: "cities/argyre.png",
            uzboy: "cities/uzboy.png",
            daedalia: "cities/daedalia.png",
            nivea: {
                district1: "cities/nivea/district_1.png",
                district2: "cities/nivea/district_2.png",
                district3: "cities/nivea/district_3.png",
                district4: "cities/nivea/district_4.png",
            },
            new_scotland: {
                west: "cities/new_scotland/west.png",
                yellow: "cities/new_scotland/yellow.png",
                blue: "cities/new_scotland/blue.png",
                red: "cities/new_scotland/red.png",
            },
            meridia: {
                ambrosia: "cities/meridia/ambrosia.png",
                aurora: "cities/meridia/aurora.png",
                ophir: "cities/meridia/ophir.png",
                terra: "cities/meridia/terra.png",
                thaumasia: "cities/meridia/thaumasia.png",
                vinogradov: "cities/meridia/vinogradov.png",
            }
        },
        borders: {
            northern_union: "borders/northern_union.png",
            meridia: "borders/meridia.png",
            east_scotland: "borders/east_scotland.png",
        },
        subdivisions: {
            northern_union: {
                district1: "borders/nivea/district_1.png",
                district2: "borders/nivea/district_2.png",
                district3: "borders/nivea/district_3.png",
                district4: "borders/nivea/district_4.png",
            },
            east_scotland: {
                yellow: "borders/new_scotland/yellow.png",
                blue: "borders/new_scotland/blue.png",
                red: "borders/new_scotland/red.png",
            },
            meridia: {
                ambrosia: "borders/meridia/ambrosia.png",
                aurora: "borders/meridia/aurora.png",
                ophir: "borders/meridia/ophir.png",
                terra: "borders/meridia/terra.png",
                thaumasia: "borders/meridia/thaumasia.png",
                vinogradov: "borders/meridia/vinogradov.png",
            }
        }
    };

    const WIDTH = 2048;
    const HEIGHT = 1024;
    const CITY_SCALE = 1.2;
    const CITY_DEBUG = 0;

    const two = new Two({
        width: WIDTH,
        height: HEIGHT
    }).appendTo(document.body);



    const base = two.makeRectangle(WIDTH / 2, HEIGHT / 2, WIDTH, HEIGHT);
    base.fill = new Two.Texture(sources.base);
    base.noStroke();

    // country borders
    addOverlay(sources.borders.northern_union);
    addOverlay(sources.borders.meridia);
    addOverlay(sources.borders.east_scotland);

    // country subdivisions
    addOverlay(sources.subdivisions.northern_union.district1);
    addOverlay(sources.subdivisions.northern_union.district2);
    addOverlay(sources.subdivisions.northern_union.district3);
    addOverlay(sources.subdivisions.northern_union.district4);

    addOverlay(sources.subdivisions.east_scotland.yellow);
    addOverlay(sources.subdivisions.east_scotland.blue);
    addOverlay(sources.subdivisions.east_scotland.red);

    addOverlay(sources.subdivisions.meridia.ambrosia);
    addOverlay(sources.subdivisions.meridia.aurora);
    addOverlay(sources.subdivisions.meridia.ophir);
    addOverlay(sources.subdivisions.meridia.terra);
    addOverlay(sources.subdivisions.meridia.thaumasia);
    addOverlay(sources.subdivisions.meridia.vinogradov);

    //nivea
    addCities(sources.cities.nivea.district1, [
        {name: "Spit",   type: "default", pos: "r", y: 0},
        {name: "Jury",   type: "default", pos: "r", y: 2, x: -2},
        {name: "Khua",   type: "default", pos: "r", y: 3},
        {name: "Spirin", type: "capital", pos: "r", x: 2},
    ])

    addCities(sources.cities.nivea.district2, [
        {name: "Akatol",     type: "default", pos: "l"},
        {name: "Borderline", type: "default", pos: "r", y: 4},
        {name: "Whiteice",   type: "subcapital", pos: "r", y: -4, x: -4},
    ])

    addCities(sources.cities.nivea.district3, [
        {name: "Acida", type: "default", pos: "l", contrast: true, x: 10, y: -4},
        {name: "Shipport", type: "subcapital", pos: "l", y: -2},
    ])

    addCities(sources.cities.nivea.district4, [
        {name: "Ironhull", type: "subcapital", pos: "r", x: 1},
        {name: "Telaroute", type: "default", pos: "l", x: 2, y: 4},
    ])

    // new scotland
    addCities(sources.cities.new_scotland.west, [
        {name: "Olympia"},
        {},
        {name: "Patron"}

    ])
    addCities(sources.cities.new_scotland.yellow, [
        {name: "Nilo", type: "subcapital", pos: "r", contrast: true},
    ])
    addCities(sources.cities.new_scotland.blue, [
        {},
        {name: "Temper", type: "subcapital", pos: "r", y: -5, x: -27, contrast: true},
    ])
    addCities(sources.cities.new_scotland.red, [
        {name: "Sacra", contrast: true, type: "default", y: 2.7, x: -1},
        {name: "Kassey", type: "capital", pos: "l", y: -4, x: 2}
    ])

    // argyre
    addCities(sources.cities.argyre, [
        {},
        {name: "Arkhangelsk"},
        {name: "Argyre City", contrast: true, pos: "l"},
    ])

    // uzboy
    addCities(sources.cities.uzboy, [
        ...blankLabel(3),
        {name: "Bosos", contrast: true, y: 3, x: -1},
        {name: "Dehi", pos: "l", y: -2, x: 1, contrast: true},
    ])

    // daedalia
    addCities(sources.cities.daedalia, [
        ...blankLabel(5),
        {name: "Agan", y: 1.5, x: -1.2},
        ...blankLabel(1),
        {name: "Memnon", x: -0.4},
        {name: "Pavonia", y: -3.5, x: -3},
        {name: "Arsia", pos: "l", y: -1},
        {name: "Ascra", y: 1}
    ])

    // meridia
    addCities(sources.cities.meridia.ambrosia, [
        ...blankLabel(3),
        {name: "New Sicily", contrast: true, type: "subcapital", y: 3, x: -2, size: 10}
    ])
    addCities(sources.cities.meridia.aurora, [
        ...blankLabel(26),
        {name: "Oxia", pos: "r", y: 0, type: "subcapital", contrast: true, size: 10},
    ])
    addCities(sources.cities.meridia.ophir, [
        ...blankLabel(4),
        {name: "Xanthus", contrast: true, type: "subcapital", size: 12, x: -1}
    ])
    addCities(sources.cities.meridia.terra, [
        ...blankLabel(13),
        {name: "Meridian", type: "capital", size: 15, y: -7, x: -35}
    ])
    addCities(sources.cities.meridia.thaumasia, [
        ...blankLabel(12),
        {name: "Solice", type: "subcapital", pos: "l", contrast: true, size: 10, y: 5, x: 18}
    ])
    addCities(sources.cities.meridia.vinogradov, [
        ...blankLabel(4),
        {name: "Geos", type: "subcapital", contrast: true, size: 10, y: 2, x: -2}
    ])

    two.update();
    two.play();
        
</script>
