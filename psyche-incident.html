<head>
    <link rel="stylesheet" href="./src/css.css">
    <script src="https://rus1130.github.io/projects/Global/typewriter.js"></script>
    <meta property="og:title"       content="PSYCHE INCIDENT"                                      />
    <meta property="og:description" content="THIS REPORT HAS BEEN RELEASED TO THE PUBLIC."         />
    <meta property="og:url"         content="https://rus1130.github.io/space2313/psyche-incident/" />
    <title>PSYCHE INCIDENT</title>
</head>
<body>
    <div id="out"></div>
    <div class="button" id="return" onclick="location.href = 'https://rus1130.github.io/space2313/'" style="display: none;">▌< Return</div>
</body>
<script>
    fetch('./src/psyche-incident.tw')
    .then(response => response.text())
    .then(text => {
        let tw3 = new Typewriter3(text, document.getElementById("out"), {
            charDelay: 28,
            newlineDelay: 150,
            customDelays: {
                ",": 335,
                ".": 650,
                ";": 650,
            },
            newpageText: "▌Next >",
            defaultTextColor: "#ffffff",
            defaultBackgroundColor: "#000000",
            onFunctionTag: () => {
                document.getElementById('return').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
                document.body.style.overflowY = 'scroll';
                document.documentElement.classList.add('hide-scrollbar');
            },
            wordWrap: 100,
        });

        let speedToggle = false;

        document.body.addEventListener('keydown', (event) => {
            if (event.code === 'Space') tw3.togglePause();
            if (event.code === 'ArrowRight') {
                speedToggle = !speedToggle;
                if(speedToggle) tw3.speedOverride(1);
                else tw3.speedOverride(null);
            }
        });

        tw3.start();
    });
</script>
