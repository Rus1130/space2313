<style>
    button:focus, input:focus, select:focus, textarea:focus, [contenteditable]:focus {
        outline:none;
    }

        font-family: Arial, sans-serif;
        max-width: 900px;

        padding: 0 20px;

        display: block;
        margin-top: 10px

    input, select {

        border: 1px solid #ccc;
        padding: 10px;

        margin-top: 15px;

        background: #f5f5f5;
        padding: 10px;

<head>
    <meta property="og:title" content="Laser Armor Model">
    <meta property="og:description" content="umm lasers wow">
    <meta property="og:url" content="https://rus1130.github.io/space2313/laser_armor_model.html">
</head>
<body>
    <h2>Laser vs. Layered Armor</h2>

    <select id="presetSelect"></select>

    <button onclick="loadPreset(presetSelect.value)">
        Load Preset
    </button>

    <button onclick="exportPreset()">
        Export Preset
    </button>

    <label>Laser Power (MW)<br><input id="power" type="number" value="50"></label>
    <label>Beam Diameter (cm)<br><input id="diam" type="number" value="10"></label>
    <label>Initial Armor Temperature (°C)<br><input id="temp" type="number" value="20"></label>

    <div id="layers"></div>

    <button onclick="addLayer()">Add Layer</button>
    <pre id="out"></pre>
</body>
<script>
    /*
        rho: density
        c: specific heat capacity (energy required to raise 1kg by 1°C)
        Tm: melting temperature
        L: latent heat of fusion (energy required to melt 1kg after reaching melting point)
        R: reflectivity
    */
    const mats = {
        "Tungsten Alloy": {
            rho: 19_300,
            c: 134,
            Tm: 3_422,
            L: 192_000,
            R:0.45
        },
        "Silicon Carbide": {
            rho: 3_210,
            c: 750,
            Tm: 2_730,
            L: 350_000,
            R: 0.20
        },
        "Carbon Composite": {
            rho: 1_800,
            c: 710,
            Tm: 3_650,
            L: 500_000,
            R: 0.10
        },
        "Titanium Alloy": {
            rho: 4_430,
            c: 520,
            Tm: 1_668,
            L: 295_000,
            R: 0.35
        },
        "Steel": {
            rho: 7_850,
            c: 5_00,
            Tm: 1_500,
            L: 272_000,
            R: 0.40
        }
    };

    const presetSelect = document.getElementById("presetSelect");

    const presets = {
        "armor": {
            "power": 1000,
            "diameter": 50,
            "initial_temp": -180,
            layers: [
                {material: "Tungsten Alloy", thickness: 200},
                {material: "Silicon Carbide", thickness: 200},
                {material: "Carbon Composite", thickness: 200}
            ]
        }
    }

    function exportPreset(){

        const preset = {
            power: Number(power.value),
            diameter: Number(diam.value),
            initial_temp: Number(temp.value),
            layers: getLayers()
        };

        console.log(JSON.stringify(preset, null, 4));
    }

    for(const name in presets){

        const option = document.createElement("option");

        option.value = name;
        option.textContent = name;

        presetSelect.appendChild(option);
    }

    function loadPreset(presetName){

        const preset = presets[presetName];

        power.value = preset.power;
        diam.value = preset.diameter;
        temp.value = preset.initial_temp;

        renderLayers(
            structuredClone(preset.layers)
        );

        calc();
    }


    function addLayer() {
        const layers = getLayers();

        layers.push({
            material: Object.keys(mats)[0],
            thickness: 10
        });

        renderLayers(layers);
        calc();
    }

    function removeLayer(index) {
        const layers = getLayers();

        layers.splice(index, 1);

        renderLayers(layers);
        calc();
    }

    function getLayers() {
        return [...document.querySelectorAll(".layer")].map(layer => ({
            material: layer.querySelector(".material").value,
            thickness: Number(layer.querySelector(".thickness").value)
        }));
    }

    const container = document.getElementById("layers");

    function renderLayers(layers = []) {
        container.innerHTML = "";

        layers.forEach((layer, i) => {
            const div = document.createElement("div");
            div.className = "layer";

            div.innerHTML =
                `<b>Layer ${i + 1}</b><br>` +
                `Material:` +
                `<select class="material">` +
                Object.keys(mats).map(mat =>
                    `<option ${mat === layer.material ? "selected" : ""}>${mat}</option>`
                ).join("") +
                `</select><br>` +
                `Thickness (cm):` +
                `<input class="thickness" type="number" value="${layer.thickness}">` +
                `<button type="button" onclick="removeLayer(${i})">Remove</button>`;

            container.appendChild(div);
        });

        calc();
    }

    function bindInputs() {
        document.querySelectorAll("input, select").forEach(el => {
            el.addEventListener("input", calc);
        });
    }

    function calc(){
        const P = +power.value * 1e6;
        const r = (+diam.value / 100) / 2;
        const A = Math.PI * r * r;
        const T0 = +temp.value;

        let out="";

        let total = 0;

        const layers = getLayers();

        layers.forEach((layer, i) => {
            // const mat = mats[document.getElementById("m"+i).value];

            // const d=+document.getElementById("t"+i).value/100;

            const mat = mats[layer.material];
            const d = layer.thickness / 100;


            const m= mat.rho * A * d;
            const Pabs = P * (1 - mat.R);
            const E = m * mat.c * (mat.Tm - T0) + m * mat.L;
            const t = E / Pabs;
            const e = mat.rho * (mat.c * (mat.Tm - T0) + mat.L);
            const v = Pabs / (A * e);

            total+=t;

            out += `Layer ${i+1}: ${layer.material}\n`+
                    `Mass: ${m.toFixed(2)} kg\n`+
                    `Absorbed Power: ${(Pabs/1e6).toFixed(2)} MW\n`+
                    `Energy to Melt: ${(E/1e6).toFixed(2)} MJ\n`+
                    `Time to Penetrate: ${t.toFixed(2)} s\n`+
                    `Penetration Rate: ${(v*1000).toFixed(2)} mm/s\n\n`;
        });

        out += "Total Penetration Time: "+total.toFixed(2)+" s";

        document.getElementById("out").textContent = out;
    }

    document.querySelectorAll("input, select").forEach(x=>x.addEventListener("input", calc));

    loadPreset("armor");
    
</script>
