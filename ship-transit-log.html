<head>
    <link rel="stylesheet" href="./src/css.css">
    <script src="https://rus1130.github.io/projects/Global/typewriter.js"></script>
    <meta property="og:title"       content="Ship Transit Log"                                      />
    <meta property="og:description" content="PROCEED TO LAUNCH."                                    />
    <meta property="og:url"         content="https://rus1130.github.io/space2313/ship-transit-log/" />
    <title>Ship Transit Log</title>
</head>
<body>
    <div id="out"></div>
    <div class="button" id="return" onclick="location.href = 'https://rus1130.github.io/space2313/'" style="display: none;">▌< Return</div>
</body>
<script type="module">
    import { SuperType } from 'https://rus1130.github.io/supertype/index.js';

    const tw = new SuperType(document.body, {
        "end": function() {
            const returnButton = document.createElement("div");
            returnButton.classList.add("button");
            returnButton.id = "return";
            returnButton.textContent = "▌< Return";
            returnButton.onclick = () => {
                location.href = 'https://rus1130.github.io/space2313/';
            };
            tw.appendToTarget(returnButton);
            tw.target.style.overflowY = 'scroll';
            tw.target.classList.add('hide-scrollbar');
        }
    })

    await tw.load("./src/ship-transit-log.st").then(() => {
        tw.allowControls("all");
        tw.start();
    })
</script>
